<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アクションゲーム</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 8vw;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
        }

        button.menu-btn {
            background-color: #ff4500;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 4vw;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        button.menu-btn:active {
            transform: translateY(2px);
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
        }

        #stage-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
            pointer-events: none;
        }

        #game-pad {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left));
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none;
        }

        .pad-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 85px;
            height: 85px;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }
        @media screen and (orientation: landscape) {
            #portrait-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="score-display" class="hidden">距離: <span id="distance">0</span>m</div>
    <div id="stage-display" class="hidden"><span id="stage-name">アスター平原</span></div>

    <div id="game-pad" class="hidden">
        <div class="pad-group">
            <div id="btn-left" class="action-btn">◀</div>
            <div id="btn-right" class="action-btn">▶</div>
        </div>
        <div class="pad-group">
            <div id="btn-jump" class="action-btn">▲</div>
        </div>
    </div>

    <div id="title-screen" class="screen">
        <h1>アクションラン</h1>
        <button id="btn-start" class="menu-btn">冒険開始</button>
        <button id="btn-ranking" class="menu-btn" onclick="alert('ランキングサーバーは未接続です\n（将来実装予定）')">ランキング</button>
        <button id="btn-avatar" class="menu-btn" onclick="alert('アバター設定画面\n（将来実装予定）')">アバター設定</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff4d4d;">GAME OVER</h1>
        <p style="font-size: 5vw; margin-bottom: 20px;">記録: <span id="final-distance">0</span>m</p>
        <button id="btn-restart" class="menu-btn">タイトルへ戻る</button>
    </div>

    <div id="portrait-warning" class="screen">
        <h2>スマホを横向きにしてください</h2>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI要素
    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const gamePad = document.getElementById('game-pad');
    const distanceEl = document.getElementById('distance');
    const finalDistanceEl = document.getElementById('final-distance');
    const stageDisplay = document.getElementById('stage-display');
    const stageNameEl = document.getElementById('stage-name');

    // メニューボタン
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', showTitle);

    // キー入力とボタン状態
    const keys = { left: false, right: false };
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') doJump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        const startAction = (e) => { e.preventDefault(); if(action === 'jump') doJump(); else keys[action] = true; };
        const endAction = (e) => { e.preventDefault(); if(action !== 'jump') keys[action] = false; };
        
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('touchstart', startAction);
        btn.addEventListener('mouseup', endAction);
        btn.addEventListener('touchend', endAction);
        btn.addEventListener('mouseleave', endAction);
    };
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');
    setupButton('btn-jump', 'jump');

    function doJump() {
        if (gameState !== 'PLAYING') return;
        if (player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;

            jumpSound.currentTime = 0;
            jumpSound.play().catch(err => {
                console.warn("ジャンプ音の再生に失敗しました:", err);
            });
        }
    }

    function resize() {
        const baseWidth = 1280; 
        const aspectRatio = window.innerHeight / window.innerWidth;
        canvas.width = baseWidth;
        canvas.height = baseWidth * aspectRatio;
    }
    window.addEventListener('resize', resize);
    
    document.addEventListener('fullscreenchange', () => { setTimeout(resize, 100); });
    document.addEventListener('webkitfullscreenchange', () => { setTimeout(resize, 100); });
    
    resize();

    // ==========================================
    // 設定：背景や敵が切り替わる距離（m）
    // ==========================================
    const STAGE2_DISTANCE = 1000; 
    const STAGE3_DISTANCE = 2000; 
    const STAGE4_DISTANCE = 3000; 
    const STAGE5_DISTANCE = 4000; 

    // 背景画像の設定
    const bgImage1 = new Image(); bgImage1.src = 'ChatGPT Image 2026年7月15日 00_45_17.png';
    const bgImage2 = new Image(); bgImage2.src = 'stage2.png';
    const bgImage3 = new Image(); bgImage3.src = 'stage3.png';
    const bgImage4 = new Image(); bgImage4.src = 'stage4.png';
    const bgImage5 = new Image(); bgImage5.src = 'stage5.png';
    const platformImg = new Image(); platformImg.src = 'platform.png';
    
    let currentBgImage = bgImage1;
    let bgOffset = 0;

    // プレイヤー・敵画像の設定
    const playerImgWalk = new Image(); playerImgWalk.src = 'si1.png';
    const playerImgJump = new Image(); playerImgJump.src = 'si2.png';
    let playerFacingRight = true;

    const enemyImg = new Image(); enemyImg.src = 'ku.png';
    const hopperGroundImg = new Image(); hopperGroundImg.src = 'バッタ地上.png';
    const hopperJumpImg = new Image(); hopperJumpImg.src = 'バッタジャンプ.png';

    const bgm = new Audio('伝承の丘.mp3'); 
    bgm.loop = true; bgm.volume = 0.5;

    const jumpSound = new Audio('jump.mp3'); 
    jumpSound.volume = 0.4;

    let gameState = 'TITLE';
    let animationId;
    let distance = 0;
    let lastTime = 0;
    const FPS = 60;
    const frameInterval = 1000 / FPS;
    
    const player = {
        x: 50, y: 200, width: 60, height: 50,
        vx: 0, vy: 0, speed: 6, gravity: 0.8, jumpPower: -13,
        isGrounded: false
    };

    let platforms = [];
    let enemies = [];
    let icicles = []; // ★追加：ツララ管理用配列

    function initMap() {
        platforms = [];
        enemies = [];
        icicles = []; // ★追加：初期化
        distance = 0;
        bgOffset = 0;
        currentBgImage = bgImage1;
        player.x = 50; player.y = 100;
        player.vx = 0; player.vy = 0;
        keys.left = false; keys.right = false;
        playerFacingRight = true; 
        
        platforms.push({ x: 0, y: canvas.height - 100, width: canvas.width, height: 100 });
    }

    function requestFullscreenAndLock(element) {
        const requestFS = element.requestFullscreen || element.webkitRequestFullscreen || element.mozRequestFullScreen || element.msRequestFullscreen;
        if (requestFS) {
            requestFS.call(element).then(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            }).catch(() => {});
        }
    }

    function startGame() {
        const container = document.getElementById('game-container');
        requestFullscreenAndLock(container);

        bgm.currentTime = 0;
        bgm.play().catch(() => {});

        titleScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        gamePad.classList.remove('hidden');
        stageDisplay.classList.remove('hidden');
        gameState = 'PLAYING';
        initMap();
        
        lastTime = performance.now();
        animationId = requestAnimationFrame(loop);
    }

    function showTitle() {
        gameOverScreen.classList.add('hidden');
        titleScreen.classList.remove('hidden');
        gameState = 'TITLE';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        bgm.pause();

        scoreDisplay.classList.add('hidden');
        gamePad.classList.add('hidden');
        stageDisplay.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalDistanceEl.innerText = Math.floor(distance);
    }

    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const gap = Math.random() * 100 + 50; 
            const width = Math.random() * 300 + 150;
            const yOffset = (Math.random() - 0.5) * 150;
            let newY = lastPlatform.y + yOffset;
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });

            // 敵の生成
            if (Math.random() < 0.5) {
                const isStage2OrMore = (distance >= STAGE2_DISTANCE);
                const enemyType = isStage2OrMore ? 'hopper' : 'normal';
                
                const eWidth = 60;
                const eHeight = (enemyType === 'hopper') ? 50 : 40;

                enemies.push({
                    type: enemyType,
                    x: newX + width / 2, y: newY - eHeight,
                    width: eWidth, height: eHeight, spawnY: newY,
                    vy: 0, isGrounded: true,
                    jumpTimer: (enemyType === 'hopper') ? Math.floor(Math.random() * 40) + 30 : 0,
                    isSquished: false, squishTimer: 0
                });
            }

            // ★追加：オロ雪原（ステージ3）のツララ生成
            const isStage3 = (distance >= STAGE3_DISTANCE && distance < STAGE4_DISTANCE);
            if (isStage3 && Math.random() < 0.4) { // 40%の確率で生成
                icicles.push({
                    x: newX + Math.random() * (width - 40) + 20, // ランダムなX座標
                    y: 0, // 画面上部から
                    width: 30,
                    height: 80,
                    vy: 0,
                    isFalling: false
                });
            }
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        if (distance >= STAGE5_DISTANCE) {
            currentBgImage = bgImage5; stageNameEl.innerText = "最終エリア（仮）";
        } else if (distance >= STAGE4_DISTANCE) {
            currentBgImage = bgImage4; stageNameEl.innerText = "未知の領域（仮）";
        } else if (distance >= STAGE3_DISTANCE) {
            currentBgImage = bgImage3; stageNameEl.innerText = "オロ雪原";
        } else if (distance >= STAGE2_DISTANCE) {
            currentBgImage = bgImage2; stageNameEl.innerText = "ヴィリカ海岸";
        } else {
            currentBgImage = bgImage1; stageNameEl.innerText = "アスター平原";
        }

        if (keys.left) {
            player.vx = -player.speed; playerFacingRight = false; 
        } else if (keys.right) {
            player.vx = player.speed; playerFacingRight = true;  
        } else {
            player.vx = 0;
        }

        player.x += player.vx;
        if (player.x < 0) player.x = 0;

        player.vy += player.gravity;
        player.y += player.vy;
        player.isGrounded = false;

        enemies.forEach(e => {
            if (e.isSquished) { e.squishTimer--; return; }

            if (e.type === 'hopper') {
                if (e.isGrounded) {
                    e.jumpTimer--;
                    if (e.jumpTimer <= 0) {
                        e.vy = -11; e.isGrounded = false;
                    }
                } else {
                    e.vy += 0.5; e.y += e.vy;
                    if (e.y >= e.spawnY - e.height) {
                        e.y = e.spawnY - e.height; e.vy = 0;
                        e.isGrounded = true; e.jumpTimer = 80; 
                    }
                }
            }
        });

        // ★追加：ツララの落下処理と当たり判定
        icicles.forEach(icicle => {
            // プレイヤーが近づいたら（X座標の差が150以下なら）落下開始
            if (!icicle.isFalling && Math.abs(player.x + player.width / 2 - (icicle.x + icicle.width / 2)) < 150) {
                icicle.isFalling = true;
            }

            if (icicle.isFalling) {
                icicle.vy += player.gravity * 0.7; // 落下速度
                icicle.y += icicle.vy;
            }

            // プレイヤーとの当たり判定
            const hitboxMargin = 10;
            if (player.x + hitboxMargin < icicle.x + icicle.width &&
                player.x + player.width - hitboxMargin > icicle.x &&
                player.y + hitboxMargin < icicle.y + icicle.height &&
                player.y + player.height - hitboxMargin > icicle.y) {
                gameOver();
            }
        });

        enemies.forEach(e => {
            if (e.isSquished) return;
            const hitboxMargin = 10; 
            if (player.x + hitboxMargin < e.x + e.width &&
                player.x + player.width - hitboxMargin > e.x &&
                player.y + hitboxMargin < e.y + e.height &&
                player.y + player.height - hitboxMargin > e.y) {
                
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.isSquished = true; e.squishTimer = 20; 
                    player.vy = player.jumpPower * 0.8; player.isGrounded = false;
                } else {
                    gameOver();
                }
            }
        });

        platforms.forEach(p => {
            const footOffset = 37; 
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height - footOffset > p.y) {
                if (player.vy > 0) {
                    player.isGrounded = true; player.vy = 0;
                    player.y = p.y - player.height + footOffset;
                } else if (player.vy < 0) {
                    player.vy = 0; player.y = p.y + p.height;
                }
            }
        });

        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold;
            player.x = scrollThreshold;
            
            distance += offset * 0.05;
            distanceEl.innerText = Math.floor(distance);

            platforms.forEach(p => p.x -= offset);
            enemies.forEach(e => e.x -= offset);
            icicles.forEach(i => i.x -= offset); // ★追加：ツララもスクロールさせる

            bgOffset += offset * 0.5;
        }

        if (platforms[0].x + platforms[0].width < -100) platforms.shift();
        
        enemies = enemies.filter(e => (e.x + e.width >= -100) && (!e.isSquished || e.squishTimer > 0));
        icicles = icicles.filter(i => (i.x + i.width >= -100) && i.y < canvas.height); // ★追加：画面外のツララを削除

        generateMap();

        if (player.y > canvas.height) {
            gameOver();
        }
    }

    function draw() {
        if (currentBgImage.complete && currentBgImage.width > 0) {
            const scale = canvas.height / currentBgImage.height;
            const scaledWidth = currentBgImage.width * scale;
            const xOffset = bgOffset % scaledWidth;
            
            ctx.drawImage(currentBgImage, -xOffset, 0, scaledWidth, canvas.height);
            ctx.drawImage(currentBgImage, -xOffset + scaledWidth, 0, scaledWidth, canvas.height);
            if (scaledWidth - xOffset < canvas.width) {
                ctx.drawImage(currentBgImage, -xOffset + scaledWidth * 2, 0, scaledWidth, canvas.height);
            }
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        platforms.forEach(p => {
            const imgHeight = 100; 
            if (platformImg.complete && platformImg.width > 0) {
                ctx.drawImage(platformImg, p.x, p.y, p.width, imgHeight);
                if (p.height > imgHeight) {
                    ctx.fillStyle = '#8B4513'; 
                    ctx.fillRect(p.x, p.y + imgHeight, p.width, p.height - imgHeight);
                }
            } else {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#228B22'; ctx.fillRect(p.x, p.y, p.width, 15);
            }
        });
        
        enemies.forEach(e => {
            if (e.type === 'hopper') {
                let currentEnemyImg = e.isGrounded ? hopperGroundImg : hopperJumpImg;
                if (currentEnemyImg.complete && currentEnemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.drawImage(currentEnemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(currentEnemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    ctx.fillStyle = 'green';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillRect(e.x, e.y, e.width, e.height);
                    }
                }
            } else {
                if (enemyImg.complete && enemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.drawImage(enemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y, e.width, e.height);
                        ctx.fillStyle = 'white'; ctx.fillRect(e.x + 5, e.y + 5, 5, 5); ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
                    }
                }
            }
        });

        // ★追加：ツララの描画（専用画像が指定されていないためCanvasAPIで図形描画）
        icicles.forEach(icicle => {
            ctx.fillStyle = '#E0FFFF'; // 薄い水色
            ctx.beginPath();
            ctx.moveTo(icicle.x, icicle.y); // 左上
            ctx.lineTo(icicle.x + icicle.width, icicle.y); // 右上
            ctx.lineTo(icicle.x + icicle.width / 2, icicle.y + icicle.height); // 中央下（尖った部分）
            ctx.closePath();
            ctx.fill();
            
            ctx.strokeStyle = '#B0E0E6'; // 枠線
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2); 
                ctx.scale(-1, 1); 
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
        } else {
            ctx.fillStyle = 'blue';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
    } 

    function loop(timestamp) {
        if (gameState === 'PLAYING') {
            animationId = requestAnimationFrame(loop);
            if (!timestamp) timestamp = performance.now();
            if (!lastTime) lastTime = timestamp;

            const elapsed = timestamp - lastTime;
            if (elapsed >= frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);
                update();
                draw();
            }
        }
    }
</script>
</body>
</html>
