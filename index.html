<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アクションゲーム</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB; /* 空の水色 */
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UI画面の共通スタイル */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 8vw;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
        }

        button.menu-btn {
            background-color: #ff4500;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 4vw;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        button.menu-btn:active {
            transform: translateY(2px);
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
        }

        /* ゲームパッド（操作ボタン） */
        #game-pad {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none; /* ボタン以外はタッチ通過 */
        }

        .pad-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none; /* ズームなどのデフォルト動作防止 */
        }
        
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* 縦画面のときの警告 */
        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }
        @media screen and (orientation: landscape) {
            #portrait-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- プレイ中の距離表示 -->
    <div id="score-display" class="hidden">距離: <span id="distance">0</span>m</div>

    <!-- 操作ボタン（プレイ中のみ表示） -->
    <div id="game-pad" class="hidden">
        <div class="pad-group">
            <div id="btn-left" class="action-btn">◀</div>
            <div id="btn-right" class="action-btn">▶</div>
        </div>
        <div class="pad-group">
            <div id="btn-jump" class="action-btn">▲</div>
        </div>
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen">
        <h1>アクションラン</h1>
        <button id="btn-start" class="menu-btn">冒険開始</button>
        <button id="btn-ranking" class="menu-btn" onclick="alert('ランキングサーバーは未接続です\n（将来実装予定）')">ランキング</button>
        <button id="btn-avatar" class="menu-btn" onclick="alert('アバター設定画面\n（将来実装予定）')">アバター設定</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff4d4d;">GAME OVER</h1>
        <p style="font-size: 5vw; margin-bottom: 20px;">記録: <span id="final-distance">0</span>m</p>
        <button id="btn-restart" class="menu-btn">タイトルへ戻る</button>
    </div>

    <!-- 縦画面警告 -->
    <div id="portrait-warning" class="screen">
        <h2>スマホを横向きにしてください</h2>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI要素
    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const gamePad = document.getElementById('game-pad');
    const distanceEl = document.getElementById('distance');
    const finalDistanceEl = document.getElementById('final-distance');

    // メニューボタン
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', showTitle);

    // キー入力とボタン状態
    const keys = { left: false, right: false };
    
    // キーボード操作設定
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') doJump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    // スマホ用ボタン操作設定
    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        const startAction = (e) => { e.preventDefault(); if(action === 'jump') doJump(); else keys[action] = true; };
        const endAction = (e) => { e.preventDefault(); if(action !== 'jump') keys[action] = false; };
        
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('touchstart', startAction);
        btn.addEventListener('mouseup', endAction);
        btn.addEventListener('touchend', endAction);
        btn.addEventListener('mouseleave', endAction);
    };
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');
    setupButton('btn-jump', 'jump');

    function doJump() {
        if (gameState !== 'PLAYING') return;
        if (player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }
    }

    // キャンバスサイズを画面に合わせる
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ゲーム状態
    let gameState = 'TITLE'; // TITLE, PLAYING, GAMEOVER
    let animationId;
    let distance = 0;
    
    // プレイヤー設定
    const player = {
        x: 50,
        y: 200,
        width: 30,
        height: 30,
        vx: 0,
        vy: 0,
        speed: 6,      // 左右の移動速度
        gravity: 0.8,
        jumpPower: -13,
        isGrounded: false
    };

    // マップ要素（地面と敵）
    let platforms = [];
    let enemies = [];

    // ゲーム初期化
    function initMap() {
        platforms = [];
        enemies = [];
        distance = 0;
        player.x = 50;
        player.y = 100;
        player.vx = 0;
        player.vy = 0;
        keys.left = false;
        keys.right = false;
        
        // 最初の足場
        platforms.push({ x: 0, y: canvas.height - 100, width: canvas.width, height: 100 });
    }

    function startGame() {
        titleScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        gamePad.classList.remove('hidden'); // ボタンを表示
        gameState = 'PLAYING';
        initMap();
        loop();
    }

    function showTitle() {
        gameOverScreen.classList.add('hidden');
        titleScreen.classList.remove('hidden');
        gameState = 'TITLE';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        scoreDisplay.classList.add('hidden');
        gamePad.classList.add('hidden'); // ボタンを隠す
        gameOverScreen.classList.remove('hidden');
        finalDistanceEl.innerText = Math.floor(distance);
    }

    // マップの自動生成
    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const gap = Math.random() * 100 + 50; 
            const width = Math.random() * 300 + 150;
            const yOffset = (Math.random() - 0.5) * 150;
            let newY = lastPlatform.y + yOffset;
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });

            // 敵の生成
            if (Math.random() < 0.5) {
                enemies.push({
                    x: newX + width / 2,
                    y: newY - 30,
                    width: 30,
                    height: 30
                });
            }
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // --- 1. 左右の移動処理 ---
        if (keys.left) {
            player.vx = -player.speed;
        } else if (keys.right) {
            player.vx = player.speed;
        } else {
            player.vx = 0;
        }

        player.x += player.vx;

        // 画面左端から外に出ないようにする
        if (player.x < 0) player.x = 0;

        // 横方向の衝突判定（壁のめり込み防止）
        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vx > 0) player.x = p.x - player.width; // 右へ移動中にぶつかった
                else if (player.vx < 0) player.x = p.x + p.width; // 左へ移動中にぶつかった
            }
        });

        // --- 2. 縦の移動処理（重力） ---
        player.vy += player.gravity;
        player.y += player.vy;
        player.isGrounded = false;

        // 縦方向の衝突判定（着地）
        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vy > 0) { // 落下中
                    player.isGrounded = true;
                    player.vy = 0;
                    player.y = p.y - player.height;
                } else if (player.vy < 0) { // 上昇中（頭をぶつけた）
                    player.vy = 0;
                    player.y = p.y + p.height;
                }
            }
        });

        // --- 3. カメラのスクロール処理 ---
        // プレイヤーが画面の中央を越えようとしたら、プレイヤーを固定してマップを動かす
        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold;
            player.x = scrollThreshold; // プレイヤーの位置を中央に戻す
            
            // スクロールした分だけ距離（スコア）を追加
            distance += offset * 0.05;
            distanceEl.innerText = Math.floor(distance);

            // マップ要素を左へずらす
            platforms.forEach(p => p.x -= offset);
            enemies.forEach(e => e.x -= offset);
        }

        // --- 4. その他の判定 ---
        // 不要になった要素の削除
        if (platforms[0].x + platforms[0].width < -100) platforms.shift();
        if (enemies.length > 0 && enemies[0].x + enemies[0].width < -100) enemies.shift();

        generateMap();

        // 敵との当たり判定
        enemies.forEach(e => {
            if (player.x < e.x + e.width &&
                player.x + player.width > e.x &&
                player.y < e.y + e.height &&
                player.y + player.height > e.y) {
                gameOver();
            }
        });

        // 落下判定
        if (player.y > canvas.height) {
            gameOver();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 地面の描画
        ctx.fillStyle = '#8B4513';
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(p.x, p.y, p.width, 15);
            ctx.fillStyle = '#8B4513';
        });

        // 敵の描画
        ctx.fillStyle = 'red';
        enemies.forEach(e => {
            ctx.fillRect(e.x, e.y, e.width, e.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(e.x + 5, e.y + 5, 5, 5);
            ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
            ctx.fillStyle = 'red';
        });

        // プレイヤーの描画
        ctx.fillStyle = 'blue';
        ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function loop() {
        if (gameState === 'PLAYING') {
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }
    }
</script>
</body>
</html>
