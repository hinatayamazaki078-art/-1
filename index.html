<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アクションゲーム</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 8vw;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
        }

        button.menu-btn {
            background-color: #ff4500;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 4vw;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        button.menu-btn:active {
            transform: translateY(2px);
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
        }

        #game-pad {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none;
        }

        .pad-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
        }
        
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }
        @media screen and (orientation: landscape) {
            #portrait-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="score-display" class="hidden">距離: <span id="distance">0</span>m</div>

    <div id="game-pad" class="hidden">
        <div class="pad-group">
            <div id="btn-left" class="action-btn">◀</div>
            <div id="btn-right" class="action-btn">▶</div>
        </div>
        <div class="pad-group">
            <div id="btn-jump" class="action-btn">▲</div>
        </div>
    </div>

    <div id="title-screen" class="screen">
        <h1>アクションラン</h1>
        <button id="btn-start" class="menu-btn">冒険開始</button>
        <button id="btn-ranking" class="menu-btn" onclick="alert('ランキングサーバーは未接続です\n（将来実装予定）')">ランキング</button>
        <button id="btn-avatar" class="menu-btn" onclick="alert('アバター設定画面\n（将来実装予定）')">アバター設定</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff4d4d;">GAME OVER</h1>
        <p style="font-size: 5vw; margin-bottom: 20px;">記録: <span id="final-distance">0</span>m</p>
        <button id="btn-restart" class="menu-btn">タイトルへ戻る</button>
    </div>

    <div id="portrait-warning" class="screen">
        <h2>スマホを横向きにしてください</h2>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI要素
    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const gamePad = document.getElementById('game-pad');
    const distanceEl = document.getElementById('distance');
    const finalDistanceEl = document.getElementById('final-distance');

    // メニューボタン
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', showTitle);

    // キー入力とボタン状態
    const keys = { left: false, right: false };
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') doJump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        const startAction = (e) => { e.preventDefault(); if(action === 'jump') doJump(); else keys[action] = true; };
        const endAction = (e) => { e.preventDefault(); if(action !== 'jump') keys[action] = false; };
        
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('touchstart', startAction);
        btn.addEventListener('mouseup', endAction);
        btn.addEventListener('touchend', endAction);
        btn.addEventListener('mouseleave', endAction);
    };
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');
    setupButton('btn-jump', 'jump');

    function doJump() {
        if (gameState !== 'PLAYING') return;
        if (player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // ★ 設定：背景や敵が切り替わる距離（m）
    // ==========================================
    const STAGE2_DISTANCE = 1000; 

    // 背景画像の設定
    const bgImage1 = new Image();
    bgImage1.src = 'ChatGPT Image 2026年7月15日 00_45_17.png'; // ステージ1の背景
    const bgImage2 = new Image();
    bgImage2.src = 'stage2.png'; // ステージ2の背景
    
    let currentBgImage = bgImage1; // 現在表示する背景
    let bgOffset = 0;

    // プレイヤー画像の設定
    const playerImgWalk = new Image();
    playerImgWalk.src = 'si1.png';
    const playerImgJump = new Image();
    playerImgJump.src = 'si2.png';
    let playerFacingRight = true;

    // 通常の敵画像の設定
    const enemyImg = new Image();
    enemyImg.src = 'ku.png';

    // ★ 1000m以降の敵（バッタ）画像の設定
    const hopperGroundImg = new Image();
    hopperGroundImg.src = 'バッタ地上.png';
    const hopperJumpImg = new Image();
    hopperJumpImg.src = 'バッタジャンプ.jpg';

    // ゲーム状態
    let gameState = 'TITLE';
    let animationId;
    let distance = 0;
    
    // キャラクターの設定
    const player = {
        x: 50,
        y: 200,
        width: 60,
        height: 50,
        vx: 0,
        vy: 0,
        speed: 6,
        gravity: 0.8,
        jumpPower: -13,
        isGrounded: false
    };

    let platforms = [];
    let enemies = [];

    function initMap() {
        platforms = [];
        enemies = [];
        distance = 0;
        bgOffset = 0;
        currentBgImage = bgImage1; // 最初は必ずステージ1の背景にする
        player.x = 50;
        player.y = 100;
        player.vx = 0;
        player.vy = 0;
        keys.left = false;
        keys.right = false;
        playerFacingRight = true; 
        
        platforms.push({ x: 0, y: canvas.height - 100, width: canvas.width, height: 100 });
    }

    function startGame() {
        titleScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        gamePad.classList.remove('hidden');
        gameState = 'PLAYING';
        initMap();
        loop();
    }

    function showTitle() {
        gameOverScreen.classList.add('hidden');
        titleScreen.classList.remove('hidden');
        gameState = 'TITLE';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        scoreDisplay.classList.add('hidden');
        gamePad.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalDistanceEl.innerText = Math.floor(distance);
    }

    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const gap = Math.random() * 100 + 50; 
            const width = Math.random() * 300 + 150;
            const yOffset = (Math.random() - 0.5) * 150;
            let newY = lastPlatform.y + yOffset;
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });

            if (Math.random() < 0.5) {
                // 1000m以降（ステージ2）かどうかで敵の種類を切り替える
                const isStage2 = (distance >= STAGE2_DISTANCE);
                const enemyType = isStage2 ? 'hopper' : 'normal';
                
                // バッタ用のサイズ（横60, 縦50）と通常の敵サイズ（横60, 縦40）
                const eWidth = 60;
                const eHeight = (enemyType === 'hopper') ? 50 : 40;

                enemies.push({
                    type: enemyType,               // 敵のタイプ区分
                    x: newX + width / 2,
                    y: newY - eHeight,
                    width: eWidth,
                    height: eHeight,
                    spawnY: newY,                  // バッタが着地すべき地面の高さ
                    vy: 0,                         // 垂直移動速度
                    isGrounded: true,              // 着地フラグ
                    jumpTimer: (enemyType === 'hopper') ? Math.floor(Math.random() * 40) + 30 : 0, // バッタのジャンプ初期ディレイ
                    isSquished: false,             // つぶれ状態フラグ
                    squishTimer: 0                 // つぶれた状態を表示する残りフレーム数
                });
            }
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // 毎フレーム距離をチェックして、背景画像を確実に切り替える
        if (distance >= STAGE2_DISTANCE) {
            currentBgImage = bgImage2;
        } else {
            currentBgImage = bgImage1;
        }

        if (keys.left) {
            player.vx = -player.speed;
            playerFacingRight = false; 
        } else if (keys.right) {
            player.vx = player.speed;
            playerFacingRight = true;  
        } else {
            player.vx = 0;
        }

        player.x += player.vx;
        if (player.x < 0) player.x = 0;

        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vx > 0) player.x = p.x - player.width;
                else if (player.vx < 0) player.x = p.x + p.width;
            }
        });

        // 落下速度と位置の更新
        player.vy += player.gravity;
        player.y += player.vy;
        player.isGrounded = false;

        // ★ 敵のタイマーとジャンプ移動の処理
        enemies.forEach(e => {
            if (e.isSquished) {
                e.squishTimer--;
                return;
            }

            // バッタ特有のジャンプ処理
            if (e.type === 'hopper') {
                if (e.isGrounded) {
                    e.jumpTimer--;
                    if (e.jumpTimer <= 0) {
                        e.vy = -11; // ジャンプ力（真上へジャンプ）
                        e.isGrounded = false;
                    }
                } else {
                    e.vy += 0.5; // バッタ用の軽い重力
                    e.y += e.vy;
                    // 元の地面の高さに戻ったら着地
                    if (e.y >= e.spawnY - e.height) {
                        e.y = e.spawnY - e.height;
                        e.vy = 0;
                        e.isGrounded = true;
                        e.jumpTimer = 80; // 着地から次のジャンプまでの間隔（約1.3秒）
                    }
                }
            }
        });

        // 敵との衝突判定（踏みつけ判定）
        enemies.forEach(e => {
            if (e.isSquished) return;

            const hitboxMargin = 10; 
            if (player.x + hitboxMargin < e.x + e.width &&
                player.x + player.width - hitboxMargin > e.x &&
                player.y + hitboxMargin < e.y + e.height &&
                player.y + player.height - hitboxMargin > e.y) {
                
                // 踏みつけ判定
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.isSquished = true;
                    e.squishTimer = 20; 
                    player.vy = player.jumpPower * 0.8; 
                    player.isGrounded = false;
                } else {
                    // 横や下から当たったらゲームオーバー
                    gameOver();
                }
            }
        });

        // 地面との衝突判定
        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vy > 0) {
                    player.isGrounded = true;
                    player.vy = 0;
                    player.y = p.y - player.height;
                } else if (player.vy < 0) {
                    player.vy = 0;
                    player.y = p.y + p.height;
                }
            }
        });

        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold;
            player.x = scrollThreshold;
            
            distance += offset * 0.05;
            distanceEl.innerText = Math.floor(distance);

            platforms.forEach(p => p.x -= offset);
            enemies.forEach(e => e.x -= offset);

            bgOffset += offset * 0.5;
        }

        if (platforms[0].x + platforms[0].width < -100) platforms.shift();
        
        // 画面外に消えた敵や、つぶれタイマー終了した敵を削除
        enemies = enemies.filter(e => (e.x + e.width >= -100) && (!e.isSquished || e.squishTimer > 0));

        generateMap();

        if (player.y > canvas.height) {
            gameOver();
        }
    }

    function draw() {
        // --- 背景の描画 ---
        if (currentBgImage.complete && currentBgImage.width > 0) {
            const scale = canvas.height / currentBgImage.height;
            const scaledWidth = currentBgImage.width * scale;
            const xOffset = bgOffset % scaledWidth;
            
            ctx.drawImage(currentBgImage, -xOffset, 0, scaledWidth, canvas.height);
            ctx.drawImage(currentBgImage, -xOffset + scaledWidth, 0, scaledWidth, canvas.height);
            if (scaledWidth - xOffset < canvas.width) {
                ctx.drawImage(currentBgImage, -xOffset + scaledWidth * 2, 0, scaledWidth, canvas.height);
            }
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- 地面の描画 ---
        ctx.fillStyle = '#8B4513';
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(p.x, p.y, p.width, 15);
            ctx.fillStyle = '#8B4513';
        });

        // --- 敵の描画 ---
        enemies.forEach(e => {
            if (e.type === 'hopper') {
                // ★ バッタ（1000m以降）の描画
                let currentEnemyImg = e.isGrounded ? hopperGroundImg : hopperJumpImg;
                if (currentEnemyImg.complete && currentEnemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.drawImage(currentEnemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(currentEnemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    // 画像読み込み前の仮表示（緑の長方形）
                    ctx.fillStyle = 'green';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillRect(e.x, e.y, e.width, e.height);
                    }
                }
            } else {
                // 通常の敵（1000m未満）の描画
                if (enemyImg.complete && enemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.drawImage(enemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    enemies.forEach(e => {
                        if (e.isSquished) {
                            const squishedHeight = e.height * 0.25;
                            ctx.fillStyle = 'red';
                            ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                        } else {
                            ctx.fillStyle = 'red';
                            ctx.fillRect(e.x, e.y, e.width, e.height);
                            ctx.fillStyle = 'white';
                            ctx.fillRect(e.x + 5, e.y + 5, 5, 5);
                            ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
                        }
                    });
                }
            }
        });

        // --- プレイヤーの描画 ---
        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2); 
                ctx.scale(-1, 1); 
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
        } else {
            ctx.fillStyle = 'blue';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
    }

    function loop() {
        if (gameState === 'PLAYING') {
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }
    }
</script>
</body>
</html>
