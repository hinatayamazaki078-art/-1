<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アクションゲーム - オンラインマルチプレイ</title>
    
    <!-- Firebase SDK (Compat v10) の読み込み -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ＝＝＝ ステータスUIのスタイル ＝＝＝ */
        #status-ui {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 320px;
            height: 110px;
            background-image: url('ステータス表示.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            z-index: 30;
            pointer-events: none;
        }

        .status-avatar {
            position: absolute;
            top: 20%; 
            left: 6%; 
            width: 22%; 
            height: 64%;
            border-radius: 50%;
            background-image: url('si1.png');
            background-size: 180%;
            background-position: top center;
            background-color: white;
        }

        .status-name-level {
            position: absolute;
            top: 25%; 
            left: 38%; 
            width: 55%;
            color: #5a3c11; 
            font-weight: bold; 
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .status-bar-container {
            position: absolute;
            left: 42%; 
            width: 42%; 
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
        }

        .stamina-bar-container { top: 62%; }
        .magic-bar-container { top: 82%; }

        .status-bar {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }
        .bar-green { background-color: #32cd32; box-shadow: 0 0 5px #32cd32; }
        .bar-yellow { background-color: #ffd700; box-shadow: 0 0 5px #ffd700; }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 40;
        }

        /* タイトル画面の設定 */
        #title-screen {
            background-image: url('タイトル画面.png');
            background-size: cover;
            background-position: center;
            background-color: transparent;
            cursor: pointer;
        }

        /* カスタム名前入力画面用スタイル */
        #name-input-field {
            font-size: 5vw;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 2px solid #fff;
            text-align: center;
            width: 60%;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 8vw;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
        }

        button.menu-btn {
            background-color: #ff4500;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 4vw;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        button.menu-btn:active {
            transform: translateY(2px);
        }

        /* ★マルチ用のボタンスタイル追加 */
        button.multi-btn {
            background-color: #4169E1;
        }
        button.multi-start-btn {
            background-color: #32cd32;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #btn-enter-gate {
            background-color: #32cd32;
            animation: pulse 1.5s infinite;
        }

        #score-display {
            position: absolute;
            top: 130px;
            left: 20px;
            font-size: 4vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
        }

        #stage-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
            pointer-events: none;
        }

        #game-pad {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left));
            box-sizing: border-box;
            z-index: 25;
            pointer-events: none;
        }

        .pad-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 85px;
            height: 85px;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* ＝＝＝ ★追加：パーティーUI用スタイル ＝＝＝ */
        .modal-box {
            background: rgba(20, 20, 40, 0.9);
            border: 4px solid #4169E1;
            border-radius: 15px;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            max-height: 80%;
            overflow-y: auto;
            text-align: center;
        }
        
        .party-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        .party-member {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px auto;
            width: 80%;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ffd700;
        }

        .member-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-image: url('si1.png');
            background-size: 180%;
            background-position: top center;
            background-color: white;
        }

        .member-info {
            text-align: left;
            flex-grow: 1;
        }

        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }
        @media screen and (orientation: landscape) {
            #portrait-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="status-ui" class="hidden">
        <div class="status-avatar"></div>
        <div class="status-name-level" onclick="changePlayerName()">
            <span id="status-name">プレイヤー</span> 
            <span id="status-level" style="margin-left: 5px;">Lv.1</span>
        </div>
        <div class="status-bar-container stamina-bar-container">
            <div id="stamina-fill" class="status-bar bar-green"></div>
        </div>
        <div class="status-bar-container magic-bar-container">
            <div id="magic-fill" class="status-bar bar-yellow"></div>
        </div>
    </div>

    <div id="score-display" class="hidden">距離: <span id="distance">0</span>m</div>
    <div id="stage-display" class="hidden"><span id="stage-name">始まりの村</span></div>

    <!-- ソロ冒険の門アクション -->
    <div id="gate-action" class="hidden" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center;">
        <button id="btn-enter-gate" class="menu-btn">ソロ冒険に出発！</button>
        <p style="color: white; font-weight: bold; text-shadow: 2px 2px 2px black; font-size: 2vw; margin-top: 10px;">▲ボタン（キー）でも出発</p>
    </div>

    <!-- ★追加：マルチ冒険の門アクション -->
    <div id="multi-gate-action" class="hidden" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center;">
        <button id="btn-create-party" class="menu-btn multi-btn">パーティー作成</button>
        <button id="btn-join-party" class="menu-btn multi-btn">パーティー参加</button>
    </div>

    <div id="game-pad" class="hidden">
        <div class="pad-group">
            <div id="btn-left" class="action-btn">◀</div>
            <div id="btn-right" class="action-btn">▶</div>
        </div>
        <div class="pad-group">
            <div id="btn-jump" class="action-btn">▲</div>
        </div>
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen"></div>

    <!-- 名前入力画面 -->
    <div id="name-input-modal" class="screen hidden" style="z-index: 60;">
        <h2 style="color: white; margin-bottom: 20px; text-shadow: 2px 2px 2px black;">名前を入力してください</h2>
        <input type="text" id="name-input-field" maxlength="10">
        <button id="btn-name-decide" class="menu-btn">決定</button>
    </div>

    <!-- ★追加：パーティー参加リスト画面 -->
    <div id="party-list-screen" class="screen hidden" style="z-index: 50;">
        <div class="modal-box">
            <h2 style="color: #FFD700; margin-bottom: 10px;">参加可能なパーティー</h2>
            <div id="party-list-container" style="min-height: 200px; max-height: 300px; overflow-y: auto;">
                <!-- ここにリストが生成されます -->
            </div>
            <button id="btn-close-party-list" class="menu-btn" style="background-color: #555;">キャンセル</button>
        </div>
    </div>

    <!-- ★追加：パーティー待機ルーム画面 -->
    <div id="party-room-screen" class="screen hidden" style="z-index: 50;">
        <div class="modal-box">
            <h2 style="color: #FFD700; margin-bottom: 10px;">待機ルーム (最大4人)</h2>
            <div id="party-members-container">
                <!-- ここにメンバー一覧が生成されます -->
            </div>
            <div style="margin-top: 20px;">
                <button id="btn-start-multi" class="menu-btn multi-start-btn hidden">冒険開始！</button>
                <button id="btn-leave-party" class="menu-btn" style="background-color: #ff4d4d;">退出する</button>
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff4d4d;">GAME OVER</h1>
        <p style="font-size: 5vw; margin-bottom: 20px;">記録: <span id="final-distance">0</span>m</p>
        <button id="btn-restart" class="menu-btn">タイトルへ戻る</button>
    </div>

    <div id="portrait-warning" class="screen">
        <h2>スマホを横向きにしてください</h2>
    </div>

    <!-- フェード演出用レイヤー -->
    <div id="fade-overlay" class="hidden" style="position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index:999; pointer-events:none; opacity:0; transition: opacity 2s ease-in-out;"></div>
</div>

<script>
    // ==========================================
    // Firebase 設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCTU0ZEsxrTcTSDEJISNvOZFA6fJFNaFXg",
      authDomain: "action-game-62bac.firebaseapp.com",
      databaseURL: "https://action-game-62bac-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "action-game-62bac",
      storageBucket: "action-game-62bac.firebasestorage.app",
      messagingSenderId: "256673568778",
      appId: "1:256673568778:web:d9c05b62cd941215f5a7f3",
      measurementId: "G-SW5TYGT4P8"
    };

    let db = null;
    let myPlayerRef = null;
    const myPlayerId = 'user_' + Math.random().toString(36).substr(2, 9);
    let otherPlayers = {};

    // ★追加：マルチプレイ用変数
    let isMultiplayer = false; 
    let currentPartyId = null;
    let isPartyLeader = false;
    let partyRef = null;
    let partyListener = null;
    let partyPositions = {};

    try {
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            setupFirebaseListeners();
        }
    } catch (err) {
        console.error("Firebase初期化エラー:", err);
    }

    function setupFirebaseListeners() {
        if (!db) return;
        const playersRef = db.ref('village_players');

        playersRef.on('child_added', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                otherPlayers[snapshot.key] = {
                    ...data, drawX: data.x, drawYOffset: data.yOffset || 0, targetX: data.x, targetYOffset: data.yOffset || 0
                };
            }
        });

        playersRef.on('child_changed', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                if (otherPlayers[snapshot.key]) {
                    otherPlayers[snapshot.key].targetX = data.x;
                    otherPlayers[snapshot.key].targetYOffset = data.yOffset || 0;
                    otherPlayers[snapshot.key].facingRight = data.facingRight;
                    otherPlayers[snapshot.key].isGrounded = data.isGrounded;
                    otherPlayers[snapshot.key].updatedAt = data.updatedAt;
                } else {
                    otherPlayers[snapshot.key] = {
                        ...data, drawX: data.x, drawYOffset: data.yOffset || 0, targetX: data.x, targetYOffset: data.yOffset || 0
                    };
                }
            }
        });

        playersRef.on('child_removed', (snapshot) => {
            delete otherPlayers[snapshot.key];
        });
    }

    let lastSyncTime = 0;
    const SYNC_INTERVAL = 100;

    // ==========================================
    // セーブ＆ロード機能
    // ==========================================
    let savedDistance = 0;

    // ★追加：マップ生成用のシード値と疑似乱数ジェネレーター
let mapSeed = 1;
let currentPartyMapSeed = 1;

function gameRandom() {
    let t = mapSeed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
    
    function saveGame() {
        const saveData = {
            playerName: playerName,
            playerLevel: playerLevel,
            playerExp: playerExp,
            currentLevelReq: currentLevelReq,
            nextLevelTotalExp: nextLevelTotalExp,
            maxStamina: maxStamina,
            currentStamina: currentStamina,
            distance: (gameState === 'PLAYING') ? distance : 0
        };
        localStorage.setItem('actionGameSaveData', JSON.stringify(saveData));
    }

    function loadGame() {
        const dataStr = localStorage.getItem('actionGameSaveData');
        if (dataStr) {
            try {
                const data = JSON.parse(dataStr);
                playerName = data.playerName || "プレイヤー";
                playerLevel = data.playerLevel || 1;
                playerExp = data.playerExp || 0;
                currentLevelReq = data.currentLevelReq || 2000;
                nextLevelTotalExp = data.nextLevelTotalExp || 2000;
                maxStamina = data.maxStamina || 100;
                currentStamina = data.currentStamina || 100;
                savedDistance = data.distance || 0;
            } catch(e) {
                console.error("セーブデータの読み込みに失敗", e);
            }
        }
    }
    
    // ★既存の関数をまるごと書き換え
    function syncMyPosition() {
        if (!db) return;
        const now = Date.now();
        if (now - lastSyncTime < SYNC_INTERVAL) return;
        lastSyncTime = now;

        if (gameState === 'VILLAGE') {
            if (!myPlayerRef) {
                myPlayerRef = db.ref('village_players/' + myPlayerId);
                myPlayerRef.onDisconnect().remove(); 
            }
            const villageGroundY = canvas.height - 110;
            const yOffset = villageGroundY - player.y;

            myPlayerRef.set({
                x: player.x,
                yOffset: yOffset,
                facingRight: playerFacingRight,
                isGrounded: player.isGrounded,
                updatedAt: now,
                name: playerName,
                level: playerLevel
            });
        } 
        // ★ここから追加：冒険中（PLAYING）の同期処理
        else if (gameState === 'PLAYING' && isMultiplayer && currentPartyId) {
            const playPosRef = db.ref('parties/' + currentPartyId + '/positions/' + myPlayerId);
            playPosRef.onDisconnect().remove();
            
            // distanceは 0.05倍されているので、実際のピクセルスクロール量は distance * 20
            const absoluteX = (distance * 20) + player.x;

            playPosRef.set({
                absX: absoluteX,
                y: player.y,
                facingRight: playerFacingRight,
                isGrounded: player.isGrounded,
                updatedAt: now,
                name: playerName,
                level: playerLevel
            });
        }
    }
    function removeMyPosition() {
        if (myPlayerRef) {
            myPlayerRef.remove();
            myPlayerRef = null;
        }
    }

    // ==========================================
    // DOM要素とイベントリスナー
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const gamePad = document.getElementById('game-pad');
    const distanceEl = document.getElementById('distance');
    const finalDistanceEl = document.getElementById('final-distance');
    const stageDisplay = document.getElementById('stage-display');
    const stageNameEl = document.getElementById('stage-name');
    const gateActionUI = document.getElementById('gate-action');
    const multiGateActionUI = document.getElementById('multi-gate-action');
    const fadeOverlay = document.getElementById('fade-overlay'); 
    
    // パーティー用UI
    const partyListScreen = document.getElementById('party-list-screen');
    const partyRoomScreen = document.getElementById('party-room-screen');
    const partyListContainer = document.getElementById('party-list-container');
    const partyMembersContainer = document.getElementById('party-members-container');
    const btnStartMulti = document.getElementById('btn-start-multi');

    // ボタンイベント
    document.getElementById('btn-enter-gate').addEventListener('click', enterSoloGate);
    document.getElementById('btn-restart').addEventListener('click', showTitle);
    
    // ★マルチ用イベント
    document.getElementById('btn-create-party').addEventListener('click', createParty);
    document.getElementById('btn-join-party').addEventListener('click', showPartyList);
    document.getElementById('btn-close-party-list').addEventListener('click', hidePartyList);
    document.getElementById('btn-leave-party').addEventListener('click', leaveParty);
    btnStartMulti.addEventListener('click', startMultiAdventure);

    titleScreen.addEventListener('click', () => {
        fadeOverlay.classList.remove('hidden');
        requestAnimationFrame(() => {
            requestAnimationFrame(() => { fadeOverlay.style.opacity = '1'; });
        });

        setTimeout(() => {
            startGame();
            fadeOverlay.style.opacity = '0';
            setTimeout(() => { fadeOverlay.classList.add('hidden'); }, 2000);
        }, 2000);
    });

    const keys = { left: false, right: false };
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') doJump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    const setupMouseBtn = (id, action) => {
        const btn = document.getElementById(id);
        btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (action === 'jump') doJump(); else keys[action] = true;
        });
        btn.addEventListener('mouseup', (e) => { e.preventDefault(); if (action !== 'jump') keys[action] = false; });
        btn.addEventListener('mouseleave', (e) => { e.preventDefault(); if (action !== 'jump') keys[action] = false; });
    };
    setupMouseBtn('btn-left', 'left');
    setupMouseBtn('btn-right', 'right');
    setupMouseBtn('btn-jump', 'jump');

    const jumpBtn = document.getElementById('btn-jump');
    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });

    function handleTouchControls(e) {
        let left = false, right = false;
        for (let i = 0; i < e.touches.length; i++) {
            const touch = e.touches[i];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target) {
                if (target.id === 'btn-left') left = true;
                if (target.id === 'btn-right') right = true;
            }
        }
        keys.left = left; keys.right = right;
    }

    window.addEventListener('touchstart', handleTouchControls, { passive: false });
    window.addEventListener('touchmove', handleTouchControls, { passive: false });
    window.addEventListener('touchend', handleTouchControls, { passive: false });
    window.addEventListener('touchcancel', handleTouchControls, { passive: false });

    // プレイヤー変数
    let playerName = "プレイヤー";
    let playerLevel = 1;
    let playerExp = 0;
    let currentLevelReq = 2000;
    let nextLevelTotalExp = 2000;
    let maxStamina = 100;
    let currentStamina = 100;

    loadGame();

    function updateStatusUI() {
        document.getElementById('status-name').innerText = playerName;
        document.getElementById('status-level').innerText = "Lv." + playerLevel;
        const staminaPercent = (currentStamina / maxStamina) * 100;
        document.getElementById('stamina-fill').style.width = Math.max(0, staminaPercent) + '%';
        document.getElementById('magic-fill').style.width = '100%';
    }

    const nameInputModal = document.getElementById('name-input-modal');
    const nameInputField = document.getElementById('name-input-field');
    const btnNameDecide = document.getElementById('btn-name-decide');

    function changePlayerName() {
        nameInputField.value = playerName;
        nameInputModal.classList.remove('hidden');
        nameInputField.focus();
    }

    btnNameDecide.addEventListener('click', () => {
        const newName = nameInputField.value;
        if (newName && newName.trim() !== "") {
            playerName = newName.trim();
            updateStatusUI();
            saveGame();
        }
        nameInputModal.classList.add('hidden');
        requestFullscreenAndLock(document.getElementById('game-container'));
    });

    function checkLevelUp() {
        let leveledUp = false;
        while (playerExp >= nextLevelTotalExp) {
            playerLevel++;
            maxStamina += 2; 
            currentStamina = maxStamina;
            currentLevelReq += 100; 
            nextLevelTotalExp += currentLevelReq;
            leveledUp = true;
        }
        if (leveledUp) updateStatusUI();
    }

    setInterval(() => {

    function joinParty(partyId) {
        if (!db) return;
        currentPartyId = partyId;
        isPartyLeader = false;
        partyRef = db.ref('parties/' + partyId);

        // トランザクションで定員チェックしつつ参加
        partyRef.child('players').transaction((players) => {
            if (players === null) return players; // パーティーが存在しない
            if (Object.keys(players).length >= 4) return undefined; // アボート（満員）
            players[myPlayerId] = { name: playerName, level: playerLevel };
            return players;
        }, (error, committed, snapshot) => {
            if (error) {
                alert("エラーが発生しました。");
            } else if (!committed) {
                alert("パーティーが満員、または解散されました。");
            } else {
                hidePartyList();
                showPartyRoom();
                partyRef.child('players/' + myPlayerId).onDisconnect().remove();
                listenToCurrentParty();
            }
        });
    }

            if (data.mapSeed !== undefined) {

    // ★新しく追加：冒険中のパーティメンバーの座標を受信する
    function setupPartyPositionsListener() {
        if (!db || !currentPartyId) return;
        partyPositions = {}; // 初期化
        const posRef = db.ref('parties/' + currentPartyId + '/positions');
        
        posRef.on('child_added', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                partyPositions[snapshot.key] = {
                    ...data, drawAbsX: data.absX, drawY: data.y
                };
            }
        });

        posRef.on('child_changed', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                if (partyPositions[snapshot.key]) {
                    partyPositions[snapshot.key].targetAbsX = data.absX;
                    partyPositions[snapshot.key].targetY = data.y;
                    partyPositions[snapshot.key].facingRight = data.facingRight;
                    partyPositions[snapshot.key].isGrounded = data.isGrounded;
                    partyPositions[snapshot.key].updatedAt = data.updatedAt;
                } else {
                    partyPositions[snapshot.key] = {
                        ...data, drawAbsX: data.absX, drawY: data.y
                    };
                }
            }
        });

        posRef.on('child_removed', (snapshot) => {
            delete partyPositions[snapshot.key];
        });
    }

    function updateVillage() {
        if (keys.left) {
            player.vx = -player.speed; playerFacingRight = false;
        } else if (keys.right) {
            player.vx = player.speed; playerFacingRight = true;
        } else {
            player.vx = 0;
        }

        player.x += player.vx;

        if (player.x < 0) player.x = 0;
        if (player.x > VILLAGE_WIDTH - player.width) player.x = VILLAGE_WIDTH - player.width;

        const villageGroundY = canvas.height - 110;
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.y + player.height > villageGroundY) {
            player.y = villageGroundY - player.height;
            player.vy = 0; player.isGrounded = true;
        } else {
            player.isGrounded = false;
        }

        cameraX = player.x + player.width / 2 - canvas.width / 2;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > VILLAGE_WIDTH - canvas.width) cameraX = VILLAGE_WIDTH - canvas.width;

        const playerCenterX = player.x + player.width / 2;
        const gateMargin = 80;
        
        // ソロ門判定
        if (playerCenterX >= SOLO_GATE_X - gateMargin && playerCenterX <= SOLO_GATE_X + GATE_WIDTH + gateMargin) {
            if (!isNearSoloGate) { isNearSoloGate = true; gateActionUI.classList.remove('hidden'); }
        } else {
            if (isNearSoloGate) { isNearSoloGate = false; gateActionUI.classList.add('hidden'); }
        }

        // ★マルチ門判定
        if (playerCenterX >= MULTI_GATE_X - gateMargin && playerCenterX <= MULTI_GATE_X + GATE_WIDTH + gateMargin) {
            if (!isNearMultiGate) { isNearMultiGate = true; multiGateActionUI.classList.remove('hidden'); }
        } else {
            if (isNearMultiGate) { isNearMultiGate = false; multiGateActionUI.classList.add('hidden'); }
        }
        
        syncMyPosition();
    }

    function drawVillage() {
        const now = Date.now();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (villageBg1.complete && villageBg1.width > 0) ctx.drawImage(villageBg1, 0 - cameraX, 0, 1280, canvas.height);
        if (villageBg2.complete && villageBg2.width > 0) ctx.drawImage(villageBg2, 1280 - cameraX, 0, 1280, canvas.height);

        const villageGroundY = canvas.height - 110;
        const gateY = villageGroundY - GATE_HEIGHT;

        // ★ソロ冒険の門 描画
        const soloGateScreenX = SOLO_GATE_X - cameraX;
        ctx.fillStyle = '#4A2E18';
        ctx.fillRect(soloGateScreenX, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(soloGateScreenX + GATE_WIDTH - 20, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(soloGateScreenX, gateY, GATE_WIDTH, 30);
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('冒険の門', soloGateScreenX + GATE_WIDTH / 2, gateY + 22);

        if (isNearSoloGate) {
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)'; ctx.beginPath();
            ctx.arc(soloGateScreenX + GATE_WIDTH / 2, gateY + GATE_HEIGHT, 80, 0, Math.PI, true); ctx.fill();
        }

        // ★マルチ冒険の門 描画
        const multiGateScreenX = MULTI_GATE_X - cameraX;
        ctx.fillStyle = '#2a4b7c'; // マルチ用は少し青っぽい色
        ctx.fillRect(multiGateScreenX, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(multiGateScreenX + GATE_WIDTH - 20, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(multiGateScreenX, gateY, GATE_WIDTH, 30);
        ctx.fillStyle = '#00FFFF'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('共闘の門(マルチ)', multiGateScreenX + GATE_WIDTH / 2, gateY + 22);

        if (isNearMultiGate) {
            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)'; ctx.beginPath();
            ctx.arc(multiGateScreenX + GATE_WIDTH / 2, gateY + GATE_HEIGHT, 80, 0, Math.PI, true); ctx.fill();
        }

        // 他プレイヤー描画
        for (let key in otherPlayers) {
            const op = otherPlayers[key];
            if (now - op.updatedAt > 5000) continue;

            if (op.targetX !== undefined) op.drawX += (op.targetX - op.drawX) * 0.2; 
            if (op.targetYOffset !== undefined) op.drawYOffset += (op.targetYOffset - op.drawYOffset) * 0.2;

            const opDrawX = op.drawX - cameraX;
            const opDrawY = villageGroundY - (op.drawYOffset || 0);

            if (opDrawX + player.width > -100 && opDrawX < canvas.width + 100) {
                let opImg = op.isGrounded ? playerImgWalk : playerImgJump;

                ctx.save();
                if (opImg.complete && opImg.width > 0) {
                    if (op.facingRight) {
                        ctx.drawImage(opImg, opDrawX, opDrawY, player.width, player.height);
                    } else {
                        ctx.translate(opDrawX + player.width / 2, opDrawY + player.height / 2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(opImg, -player.width / 2, -player.height / 2, player.width, player.height);
                    }
                } else {
                    ctx.fillStyle = 'orange'; ctx.fillRect(opDrawX, opDrawY, player.width, player.height);
                }
                ctx.restore();

                ctx.fillStyle = '#00FFCC'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                const opName = op.name || "プレイヤー";
                const opLevel = op.level || 1;
                ctx.fillText(opName + " Lv." + opLevel, opDrawX + player.width / 2, opDrawY - 8);
            }
        }

        // 自分描画
        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        const drawX = player.x - cameraX;

        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, drawX, player.y, player.width, player.height);
            } else {
                ctx.translate(drawX + player.width / 2, player.y + player.height / 2);
                ctx.scale(-1, 1);
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = 'blue'; ctx.fillRect(drawX, player.y, player.width, player.height);
        }

        ctx.fillStyle = '#FFFF00'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(playerName + " Lv." + playerLevel, drawX + player.width / 2, player.y - 8);
    }

    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const isStage6 = (distance >= getDistance('s6') && distance < getDistance('s7'));
            
            // ★ Math.random() を gameRandom() に変更
            const gap = isStage6 ? -2 : gameRandom() * 100 + 50; 
            const yOffset = isStage6 ? 0 : (gameRandom() - 0.5) * 150;
            
            let newY = lastPlatform.y + yOffset;
            const width = gameRandom() * 300 + 150; // ★ 変更
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });

            if (gameRandom() < 0.5) { // ★ 変更
                let enemyType = 'normal';
                if (distance >= getDistance('s4') && distance < getDistance('s5')) {
                    enemyType = gameRandom() < 0.5 ? 'normal' : 'hopper'; // ★ 変更
                } else if (distance >= getDistance('s2')) {
                    enemyType = 'hopper';
                }
                const eWidth = 60;
                const eHeight = (enemyType === 'hopper') ? 50 : 40;
                const enemyOffset = 37; 
                enemies.push({
                    type: enemyType, x: newX + width / 2, y: newY - eHeight + enemyOffset,
                    width: eWidth, height: eHeight, spawnY: newY + enemyOffset,
                    vy: 0, isGrounded: true, 
                    jumpTimer: (enemyType === 'hopper') ? Math.floor(gameRandom() * 40) + 30 : 0, // ★ 変更
                    isSquished: false, squishTimer: 0
                });
            } else if (isStage6 && gameRandom() < 0.7) { // ★ 変更
                const cactusSize = 70; const embedAmount = 37; 
                cacti.push({ x: newX + width / 2, y: newY - cactusSize + embedAmount, width: cactusSize, height: cactusSize });
            }
            
            const isStage3 = (distance >= getDistance('s3') && distance < getDistance('s4'));
            if (isStage3 && gameRandom() < 0.4) { // ★ 変更
                icicles.push({ x: newX + gameRandom() * (width - 40) + 20, y: 0, width: 30, height: 80, vy: 0, isFalling: false }); // ★ 変更
            }
            
            if (gameRandom() < 0.3) { // ★ 変更
                const boxSize = 60; const embedAmount = 45;
                boxes.push({ x: newX + width / 2 + 80, y: newY - boxSize + embedAmount, width: boxSize, height: boxSize });
            }
        }
    }
    
    function update() {
        if (gameState === 'VILLAGE') { updateVillage(); return; }
        if (gameState !== 'PLAYING') return;

        // ★距離計算の倍率反映
        if (distance >= getDistance('s5')) {
            currentBgImage = bgImage5; stageNameEl.innerText = "グリオン砂漠" + (isMultiplayer ? "(マルチ)" : "");
        } else if (distance >= getDistance('s4')) {
            currentBgImage = bgImage4; stageNameEl.innerText = "レニリアの森" + (isMultiplayer ? "(マルチ)" : "");
        } else if (distance >= getDistance('s3')) {
            currentBgImage = bgImage3; stageNameEl.innerText = "オロ雪原" + (isMultiplayer ? "(マルチ)" : "");
        } else if (distance >= getDistance('s2')) {
            currentBgImage = bgImage2; stageNameEl.innerText = "ヴィリカ海岸" + (isMultiplayer ? "(マルチ)" : "");
        } else {
            currentBgImage = bgImage1; stageNameEl.innerText = "アスター平原" + (isMultiplayer ? "(マルチ)" : "");
        }

        if (keys.left) { player.vx = -player.speed; playerFacingRight = false; } 
        else if (keys.right) { player.vx = player.speed; playerFacingRight = true; } 
        else { player.vx = 0; }

        player.x += player.vx;
        if (player.x < 0) player.x = 0;

        if (distance >= getDistance('s5')) {
            if (!isWindy && !windWarning) {
                if (Math.random() < 0.005) { windWarning = true; windTimer = 60; }
            } else if (windWarning) {
                windTimer--; if (windTimer <= 0) { windWarning = false; isWindy = true; windTimer = 150; }
            } else if (isWindy) {
                windTimer--; player.x -= 4.0; if (player.x < 0) player.x = 0;
                if (windTimer <= 0) { isWindy = false; }
            }
        }

        player.vy += player.gravity; player.y += player.vy; player.isGrounded = false;

        enemies.forEach(e => {
            if (e.isSquished) { e.squishTimer--; return; }
            if (e.type === 'hopper') {
                if (e.isGrounded) {
                    e.jumpTimer--; if (e.jumpTimer <= 0) { e.vy = -11; e.isGrounded = false; }
                } else {
                    e.vy += 0.5; e.y += e.vy;
                    if (e.y >= e.spawnY - e.height) { e.y = e.spawnY - e.height; e.vy = 0; e.isGrounded = true; e.jumpTimer = 80; }
                }
            }
        });

        icicles.forEach(icicle => {
            if (!icicle.isFalling && Math.abs(player.x + player.width / 2 - (icicle.x + icicle.width / 2)) < 150) { icicle.isFalling = true; }
            if (icicle.isFalling) { icicle.vy += player.gravity * 0.7; icicle.y += icicle.vy; }

            const hitboxMargin = 10;
            if (player.x + hitboxMargin < icicle.x + icicle.width && player.x + player.width - hitboxMargin > icicle.x &&
                player.y + hitboxMargin < icicle.y + icicle.height && player.y + player.height - hitboxMargin > icicle.y) {
                gameOver();
            }
        });

        enemies.forEach(e => {
            if (e.isSquished) return;
            const hitboxMargin = 10; 
            if (player.x + hitboxMargin < e.x + e.width && player.x + player.width - hitboxMargin > e.x &&
                player.y + hitboxMargin < e.y + e.height && player.y + player.height - hitboxMargin > e.y) {
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.isSquished = true; e.squishTimer = 20; player.vy = player.jumpPower * 0.8; player.isGrounded = false;
                } else { gameOver(); }
            }
        });

        platforms.forEach(p => {
            const footOffset = 37; const marginX = 15;
            if (player.x + marginX < p.x + p.width && player.x + player.width - marginX > p.x &&
                player.y < p.y + p.height && player.y + player.height - footOffset > p.y) {
                if (player.vy > 0) {
                    player.isGrounded = true; player.vy = 0; player.y = p.y - player.height + footOffset;
                } else if (player.vy < 0) { player.vy = 0; player.y = p.y + p.height; }
            }
        });

        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold; player.x = scrollThreshold;
            let addedDist = offset * 0.05;
            distance += addedDist; playerExp += addedDist;
            distanceEl.innerText = Math.floor(distance);
            
            checkLevelUp();
            platforms.forEach(p => p.x -= offset); enemies.forEach(e => e.x -= offset);
            icicles.forEach(i => i.x -= offset); boxes.forEach(b => b.x -= offset); cacti.forEach(c => c.x -= offset);
            bgOffset += offset * 0.5;
        }

        if (platforms[0].x + platforms[0].width < -100) platforms.shift();
        
        enemies = enemies.filter(e => (e.x + e.width >= -100) && (!e.isSquished || e.squishTimer > 0));
        icicles = icicles.filter(i => (i.x + i.width >= -100) && i.y < canvas.height);
        boxes = boxes.filter(b => b.x + b.width >= -100);
        cacti = cacti.filter(c => c.x + c.width >= -100);

        cacti.forEach(c => {
            const hitboxMargin = 15;
            if (player.x + hitboxMargin < c.x + c.width && player.x + player.width - hitboxMargin > c.x &&
                player.y + hitboxMargin < c.y + c.height && player.y + player.height - hitboxMargin > c.y) {
                gameOver();
            }
        });

        boxes.forEach(b => {
            const marginX = 15; const footOffset = 37; const standOffset = 20;
            const pLeft = player.x + marginX; const pRight = player.x + player.width - marginX;
            const pTop = player.y; const pBottom = player.y + player.height - footOffset + standOffset;

            if (pLeft < b.x + b.width && pRight > b.x && pTop < b.y + b.height && pBottom > b.y) {
                if (player.vy > 0 && pBottom - player.vy <= b.y + 25) {
                    player.isGrounded = true; player.vy = 0; player.y = b.y - player.height + footOffset - standOffset;
                } else {
                    if (player.vx > 0) { player.x = b.x - player.width + marginX; } 
                    else if (player.vx < 0) { player.x = b.x + b.width - marginX; }
                }
            }
        });
        
        generateMap();

        if (player.y > canvas.height) gameOver();
        syncMyPosition();
    }

    function draw() {
        if (gameState === 'VILLAGE') { drawVillage(); return; }

        if (currentBgImage.complete && currentBgImage.width > 0) {
            const scale = canvas.height / currentBgImage.height;
            const scaledWidth = currentBgImage.width * scale;
            const xOffset = bgOffset % scaledWidth;
            
            ctx.drawImage(currentBgImage, -xOffset, 0, scaledWidth, canvas.height);
            ctx.drawImage(currentBgImage, -xOffset + scaledWidth, 0, scaledWidth, canvas.height);
            if (scaledWidth - xOffset < canvas.width) {
                ctx.drawImage(currentBgImage, -xOffset + scaledWidth * 2, 0, scaledWidth, canvas.height);
            }
        } else { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        platforms.forEach(p => {
            const imgHeight = 100; 
            if (platformImg.complete && platformImg.width > 0) {
                ctx.drawImage(platformImg, p.x, p.y, p.width, imgHeight);
                if (p.height > imgHeight) { ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y + imgHeight, p.width, p.height - imgHeight); }
            } else {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#228B22'; ctx.fillRect(p.x, p.y, p.width, 15);
            }
        });
        
        enemies.forEach(e => {
            if (e.type === 'hopper') {
                let currentEnemyImg = e.isGrounded ? hopperGroundImg : hopperJumpImg;
                if (currentEnemyImg.complete && currentEnemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.drawImage(currentEnemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.drawImage(currentEnemyImg, e.x, e.y, e.width, e.height); }
                } else {
                    ctx.fillStyle = 'green';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.fillRect(e.x, e.y, e.width, e.height); }
                }
            } else {
                if (enemyImg.complete && enemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.drawImage(enemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height); }
                } else {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y, e.width, e.height);
                        ctx.fillStyle = 'white'; ctx.fillRect(e.x + 5, e.y + 5, 5, 5); ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
                    }
                }
            }
        });

        icicles.forEach(icicle => {
            ctx.fillStyle = '#E0FFFF'; ctx.beginPath();
            ctx.moveTo(icicle.x, icicle.y); ctx.lineTo(icicle.x + icicle.width, icicle.y); ctx.lineTo(icicle.x + icicle.width / 2, icicle.y + icicle.height);
            ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#B0E0E6'; ctx.lineWidth = 2; ctx.stroke();
        });

        boxes.forEach(b => {
            if (boxImg.complete && boxImg.width > 0) { ctx.drawImage(boxImg, b.x, b.y, b.width, b.height); } 
            else { ctx.fillStyle = '#8B4513'; ctx.fillRect(b.x, b.y, b.width, b.height); }
        });

        cacti.forEach(c => {
            if (cactusImg.complete && cactusImg.width > 0) { ctx.drawImage(cactusImg, c.x, c.y, c.width, c.height); } 
            else { ctx.fillStyle = 'green'; ctx.fillRect(c.x, c.y, c.width, c.height); }
        });

if (isMultiplayer && currentPartyId) {
            const now = Date.now();
            const myAbsXBase = distance * 20; // 自分がスクロールした総ピクセル量

            for (let key in partyPositions) {
                const op = partyPositions[key];
                if (now - op.updatedAt > 5000) continue; // 通信が途切れたら非表示

                // なめらかに動かすための補間
                if (op.targetAbsX !== undefined) op.drawAbsX += (op.targetAbsX - op.drawAbsX) * 0.2;
                if (op.targetY !== undefined) op.drawY += (op.targetY - op.drawY) * 0.2;

                // 相手の絶対座標から、自分のスクロール量を引いて画面内の位置を計算
                const opDrawX = op.drawAbsX - myAbsXBase;
                const opDrawY = op.drawY;

                // 画面内にいる時だけ描画する
                if (opDrawX + player.width > -100 && opDrawX < canvas.width + 100) {
                    let opImg = op.isGrounded ? playerImgWalk : playerImgJump;
                    ctx.save();
                    if (opImg.complete && opImg.width > 0) {
                        if (op.facingRight) {
                            ctx.drawImage(opImg, opDrawX, opDrawY, player.width, player.height);
                        } else {
                            ctx.translate(opDrawX + player.width / 2, opDrawY + player.height / 2);
                            ctx.scale(-1, 1);
                            ctx.drawImage(opImg, -player.width / 2, -player.height / 2, player.width, player.height);
                        }
                    } else {
                        ctx.fillStyle = 'orange'; ctx.fillRect(opDrawX, opDrawY, player.width, player.height);
                    }
                    ctx.restore();

                    ctx.fillStyle = '#00FFCC'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                    const opName = op.name || "プレイヤー";
                    ctx.fillText(opName, opDrawX + player.width / 2, opDrawY - 8);
                }
            }
        }
        
        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) { ctx.drawImage(currentImg, player.x, player.y, player.width, player.height); } 
            else {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2); 
                ctx.scale(-1, 1); 
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
        } else { ctx.fillStyle = 'blue'; ctx.fillRect(player.x, player.y, player.width, player.height); }

        if (windWarning) {
            ctx.fillStyle = "rgba(255, 69, 0, 0.8)"; ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("⚠️ 突風注意！", canvas.width / 2, canvas.height / 3);
        } else if (isWindy) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)"; ctx.font = "bold 40px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("༄༅༄༅ 突風発生中！ ༄༅༄༅", canvas.width / 2, canvas.height / 3);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 3;
            for (let i = 0; i < 6; i++) {
                let windX = Math.random() * canvas.width; let windY = Math.random() * canvas.height;
                ctx.beginPath(); ctx.moveTo(windX, windY); ctx.lineTo(windX - (100 + Math.random() * 150), windY); ctx.stroke();
            }
        }
    } 

    function loop(timestamp) {
        if (gameState === 'PLAYING' || gameState === 'VILLAGE') {
            animationId = requestAnimationFrame(loop);
            if (!timestamp) timestamp = performance.now();
            if (!lastTime) lastTime = timestamp;

            const elapsed = timestamp - lastTime;
            if (elapsed >= frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);
                update();
                draw();
            }
        }
    }
</script>
