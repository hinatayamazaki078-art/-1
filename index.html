<!DOCTYPE html>
<html lang="ja">
<head>

    <!-- Firebase SDK (Compat v10) の読み込み -->

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ＝＝＝ ステータスUIのスタイル ＝＝＝ */
#status-ui {
    position: absolute;
    top: 10px;
    left: 20px;
    width: 320px;
    max-width: 85vw; /* スマホ等での幅のはみ出し防止のみ残す */
    height: 135px;
    background-image: url('ステータス表示.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    /* 余計な背景色や影（box-shadow）は削除し、イラストをそのまま表示 */
    z-index: 30;
    pointer-events: none;
    box-sizing: border-box;
}

.status-avatar {
    position: absolute;
    top: 20%; 
    left: 6%; 
    width: 22%; 
    height: 64%;
    border-radius: 50%;
    background-image: url('si1.png');
    background-size: 180%;
    background-position: center;
    /* イラストの枠に合うよう、余計なボーダーと背景色を削除（必要に応じて戻してください） */
    box-sizing: border-box;
}

.status-name-level {
    position: absolute;
    top: 15%; 
    left: 38%; 
    width: 58%;
    color: #5a3c11; 
    font-weight: bold; 
    font-size: 18px;
    cursor: pointer;
    pointer-events: auto;
    /* イラストが暗くても文字が読めるよう、白いフチドリ（光彩）を強めに設定 */
    text-shadow: 
        1px 1px 0px rgba(255,255,255,0.9),
        -1px -1px 0px rgba(255,255,255,0.9),
        1px -1px 0px rgba(255,255,255,0.9),
        -1px 1px 0px rgba(255,255,255,0.9),
        0px 0px 5px rgba(255,255,255,1);
    white-space: nowrap; /* 文字の折り返しによる潰れを防止 */
    overflow: hidden; 
    text-overflow: ellipsis; /* 長すぎる場合は「...」で省略 */
}

/* コイン表示スタイル */
#status-coins {
    position: absolute;
    top: 40%;
    left: 38%;
    width: 58%;
    color: #FFD700;
    font-weight: bold;
    font-size: 16px;
    /* コインも同様に黒いフチドリを強めにして視認性をアップ */
    text-shadow: 
        1px 1px 0px #000,
        -1px -1px 0px #000,
        1px -1px 0px #000,
        -1px 1px 0px #000,
        0px 0px 3px rgba(0,0,0,0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status-bar-container {
    position: absolute;
    left: 42%; 
    width: 50%;
    height: 10px;
    background: rgba(0,0,0,0.6); 
    border-radius: 5px;
    overflow: hidden;
}

.stamina-bar-container { top: 58%; }
.magic-bar-container { top: 73%; }
.guard-bar-container { 
    position: absolute;
    left: 42%; 
    width: 50%;
    height: 10px;
    background: rgba(0,0,0,0.6); 
    border-radius: 5px;
    overflow: hidden;
    top: 88%; 
}
.bar-green { background-color: #32cd32; box-shadow: 0 0 5px #32cd32; }
.bar-yellow { background-color: #ffd700; box-shadow: 0 0 5px #ffd700; }

<script>
    // ==========================================
    // Firebase 設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCTU0ZEsxrTcTSDEJISNvOZFA6fJFNaFXg",
      authDomain: "action-game-62bac.firebaseapp.com",
      databaseURL: "https://action-game-62bac-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "action-game-62bac",
      storageBucket: "action-game-62bac.firebasestorage.app",
      messagingSenderId: "256673568778",
      appId: "1:256673568778:web:d9c05b62cd941215f5a7f3",
      measurementId: "G-SW5TYGT4P8"
    };

    let db = null;
    let myPlayerRef = null;
    const myPlayerId = 'user_' + Math.random().toString(36).substr(2, 9);
    let otherPlayers = {};

    let isMultiplayer = false; 
    let currentPartyId = null;
    let isPartyLeader = false;
    let partyRef = null;
    let partyListener = null;
    let partyPositions = {};

    try {
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            setupFirebaseListeners();
        }
    } catch (err) {
        console.error("Firebase初期化エラー:", err);
    }

    function setupFirebaseListeners() {
        if (!db) return;
        const playersRef = db.ref('village_players');

        playersRef.on('child_added', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                otherPlayers[snapshot.key] = {
                    ...data, drawX: data.x, drawYOffset: data.yOffset || 0, targetX: data.x, targetYOffset: data.yOffset || 0
                };
            }
        });

        playersRef.on('child_changed', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                if (otherPlayers[snapshot.key]) {
                    otherPlayers[snapshot.key].targetX = data.x;
                    otherPlayers[snapshot.key].targetYOffset = data.yOffset || 0;
                    otherPlayers[snapshot.key].facingRight = data.facingRight;
                    otherPlayers[snapshot.key].isGrounded = data.isGrounded;
                    otherPlayers[snapshot.key].updatedAt = data.updatedAt;
                    otherPlayers[snapshot.key].avatar = data.avatar; // アバター情報更新
                    // 他のプレイヤーが新しいメッセージを送信したかチェック
                    if (data.msgId && otherPlayers[snapshot.key].msgId !== data.msgId) {
                        otherPlayers[snapshot.key].message = data.message;
                        otherPlayers[snapshot.key].messageTimer = 180; // 新しいメッセージが来たらタイマーをリセット
                        otherPlayers[snapshot.key].msgId = data.msgId;
                    }
                    otherPlayers[snapshot.key].isTyping = data.isTyping;
                } else {
                    otherPlayers[snapshot.key] = {
                        ...data, drawX: data.x, drawYOffset: data.yOffset || 0, targetX: data.x, targetYOffset: data.yOffset || 0
                    };
                }
            }
        });

        playersRef.on('child_removed', (snapshot) => {
            delete otherPlayers[snapshot.key];
        });
    }

    let lastSyncTime = 0;
    const SYNC_INTERVAL = 100;

    // ==========================================
    // アバター・ショップ・セーブ機能
    // ==========================================
    const playerImgWalk = new Image(); playerImgWalk.src = 'si1.png';
    const playerImgJump = new Image(); playerImgJump.src = 'si2.png';
    const sparrowWalk = new Image(); sparrowWalk.src = '雀歩き.png';
    const sparrowJump = new Image(); sparrowJump.src = '雀ジャンプ.png';
    const shopImg = new Image(); shopImg.src = 'アバター変更ショップ.png';
    const guardImg = new Image(); guardImg.src = 'si守り.png';

    function handleTouchControls(e) {
        let left = false, right = false;
        for (let i = 0; i < e.touches.length; i++) {
            const touch = e.touches[i];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target) {
                if (target.id === 'btn-left') left = true;
                if (target.id === 'btn-right') right = true;
            }
        }
        keys.left = left; keys.right = right;
    }

function openShop() {
    shopCoinDisplay.innerText = coins;
    shopItemsContainer.innerHTML = '';
    
    for (let key in avatars) {
        const av = avatars[key];
        const isOwned = ownedAvatars.includes(key);

        div.style.border = isEquipped ? '3px solid #32cd32' : '1px solid #aaa';
        div.style.textAlign = 'center';
        div.style.width = '130px';
        
        let btnHtml = '';
        if (isEquipped) {
            btnHtml = `<button disabled style="padding:8px; background:gray; color:white; border:none; border-radius:5px; width:100%;">装備中</button>`;
        } else if (isOwned) {
            btnHtml = `<button onclick="equipAvatar('${key}')" style="padding:8px; background:#32cd32; color:white; border:none; border-radius:5px; cursor:pointer; width:100%; font-weight:bold;">装備する</button>`;
        } else {
            // ▼ 変更箇所: コインと素材の所持条件をチェック
            const reqYume = av.reqYumeyuri || 0;
            const reqBlue = av.reqBlueButterfly || 0;
            const canBuy = (coins >= av.cost) && (myInventory.yumeyuri >= reqYume) && (myInventory.blueButterfly >= reqBlue);
            
            const btnColor = canBuy ? '#FFD700' : 'gray';
            
            // ボタン内に表示するテキストを作成（必要素材がある場合は改行して追加表示）
            let costText = `${av.cost} コイン`;
            if (reqYume > 0) costText += `<br><span style="font-size:11px;">ﾕﾒﾕﾘ: ${reqYume}個</span>`;
            if (reqBlue > 0) costText += `<br><span style="font-size:11px;">青蝶: ${reqBlue}個</span>`;

            btnHtml = `<button ${canBuy?'':'disabled'} onclick="buyAvatar('${key}')" style="padding:8px; background:${btnColor}; color:black; font-weight:bold; border:none; border-radius:5px; cursor:pointer; width:100%;">${costText}</button>`;
        }
        
        div.innerHTML = `
            <img src="${av.walk.src}" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px;">
            <div style="color:white; font-weight:bold; margin-bottom:10px;">${av.name}</div>
            ${btnHtml}
        `;
        shopItemsContainer.appendChild(div);
    }

}

window.buyAvatar = function(key) {
    const av = avatars[key];
    
    // ▼ 追加: 必要な素材数を取得（設定がない場合は0）
    const reqYume = av.reqYumeyuri || 0;
    const reqBlue = av.reqBlueButterfly || 0;

    // ▼ 変更: コインだけでなく素材の所持数も条件に追加
    if (coins >= av.cost && myInventory.yumeyuri >= reqYume && myInventory.blueButterfly >= reqBlue && !ownedAvatars.includes(key)) {
        
        // コインと素材を消費
        coins -= av.cost;
        myInventory.yumeyuri -= reqYume;
        myInventory.blueButterfly -= reqBlue;
        
        ownedAvatars.push(key);
        currentAvatar = key;
        saveGame();
        updateStatusUI();
        openShop(); // 表示をリフレッシュ
        syncMyPosition();
    }
};

                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            }).catch(() => {});
        }
    }

    function createParty() {
        if (!db) return alert("通信エラー：マルチプレイを利用できません。");
        partyRef = db.ref('parties').push();
        currentPartyId = partyRef.key;
        isPartyLeader = true;
        const newMapSeed = Math.floor(Math.random() * 1000000);
        partyRef.set({
            leaderId: myPlayerId,
            leaderName: playerName,
            leaderLevel: playerLevel,
            status: 'waiting',
            mapSeed: newMapSeed, 
            players: {
                [myPlayerId]: { name: playerName, level: playerLevel }
            }
        });
        partyRef.onDisconnect().remove();
        showPartyRoom();
        listenToCurrentParty();
    }
    
    function showPartyList() {
        if (!db) return alert("通信エラー：マルチプレイを利用できません。");
        partyListScreen.classList.remove('hidden');
        partyListContainer.innerHTML = "<p style='color:white;'>検索中...</p>";
        
        db.ref('parties').once('value', (snapshot) => {
            partyListContainer.innerHTML = "";
            let count = 0;
            snapshot.forEach((child) => {
                const data = child.val();
                if (data.status === 'waiting') {
                    count++;
                    const playerKeys = Object.keys(data.players || {});
                    const numPlayers = playerKeys.length;
                    
                    const div = document.createElement('div');
                    div.className = 'party-list-item';
                    
                    const info = document.createElement('div');
                    info.style.textAlign = 'left';
                    info.innerHTML = `
                        <div style="color: #FFD700; font-weight: bold; font-size: 20px;">${data.leaderName} <span style="font-size:14px; color:#ccc;">(Lv.${data.leaderLevel})</span></div>
                        <div style="color: white; font-size: 14px;">メンバー: ${numPlayers} / 4人</div>
                    `;
                    
                    const joinBtn = document.createElement('button');
                    joinBtn.className = 'menu-btn multi-btn';
                    joinBtn.style.padding = '10px 20px';
                    joinBtn.style.fontSize = '16px';
                    if (numPlayers >= 4) {
                        joinBtn.innerText = '満員';
                        joinBtn.disabled = true;
                        joinBtn.style.backgroundColor = '#888';
                    } else {
                        joinBtn.innerText = '参加';
                        joinBtn.onclick = () => joinParty(child.key);
                    }
                    div.appendChild(info);
                    div.appendChild(joinBtn);
                    partyListContainer.appendChild(div);
                }
            });
            if (count === 0) {
                partyListContainer.innerHTML = "<p style='color:white;'>現在参加可能なパーティーはありません。</p>";
            }
        });
    }

    function hidePartyList() { partyListScreen.classList.add('hidden'); }

    function joinParty(partyId) {
        if (!db) return;
        currentPartyId = partyId;
        isPartyLeader = false;
        partyRef = db.ref('parties/' + partyId);

        partyRef.child('players').transaction((players) => {
            if (players === null) return players; 
            if (Object.keys(players).length >= 4) return undefined; 
            players[myPlayerId] = { name: playerName, level: playerLevel };
            return players;
        }, (error, committed, snapshot) => {
            if (error) { alert("エラーが発生しました。"); } 
            else if (!committed) { alert("パーティーが満員、または解散されました。"); } 
            else {
                hidePartyList();
                showPartyRoom();
                partyRef.child('players/' + myPlayerId).onDisconnect().remove();
                listenToCurrentParty();
            }
        });
    }

    function showPartyRoom() {
        partyRoomScreen.classList.remove('hidden');
        if (isPartyLeader) { btnStartMulti.classList.remove('hidden'); } 
        else { btnStartMulti.classList.add('hidden'); }
    }

    function leaveParty() {
        if (!partyRef) return;
        if (isPartyLeader) { partyRef.remove(); } 
        else { partyRef.child('players/' + myPlayerId).remove(); }
        cleanupPartyData();
    }

    function cleanupPartyData() {
        if (partyListener && partyRef) partyRef.off('value', partyListener);
        if (enemiesDefeatedListener && currentPartyId && db) {
            db.ref('parties/' + currentPartyId + '/enemiesDefeated').off('child_added', enemiesDefeatedListener);
        }
        enemiesDefeatedListener = null;
        partyRoomScreen.classList.add('hidden');
        currentPartyId = null;
        isPartyLeader = false;
        partyRef = null;
        partyListener = null;
    }

    function listenToCurrentParty() {
        if (!partyRef) return;
        partyListener = partyRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                alert("パーティーが解散されました。");
                cleanupPartyData(); return;
            }

            if (data.mapSeed !== undefined) { currentPartyMapSeed = data.mapSeed; }

            partyMembersContainer.innerHTML = "";
            const players = data.players || {};
            for (let pid in players) {
                const p = players[pid];
                const div = document.createElement('div');
                div.className = 'party-member';
                div.innerHTML = `
                    <div class="member-avatar"></div>
                    <div class="member-info">
                        <div style="color: white; font-size: 18px; font-weight: bold;">${p.name} <span style="font-size:14px; color:#ffd700;">(Lv.${p.level})</span></div>
                        <div style="color: #aaa; font-size: 12px;">${pid === data.leaderId ? '★リーダー' : 'メンバー'}</div>
                    </div>
                `;
                partyMembersContainer.appendChild(div);
            }

            if (data.status === 'playing') {
                if (partyListener && partyRef) partyRef.off('value', partyListener);
                partyRoomScreen.classList.add('hidden');
                executeAdventure(true);
            }
        });
    }

    function startMultiAdventure() {
        if (!isPartyLeader || !partyRef) return;
        partyRef.update({ status: 'playing' });
    }

    function enterSoloGate() {
        if (gameState !== 'VILLAGE') return;
        executeAdventure(false);

    function setupPartyPositionsListener() {
        if (!db || !currentPartyId) return;
        partyPositions = {}; 
        const posRef = db.ref('parties/' + currentPartyId + '/positions');
        
        posRef.on('child_added', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                partyPositions[snapshot.key] = { ...data, drawAbsX: data.absX, drawY: data.y };
            }
        });

        posRef.on('child_changed', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                if (partyPositions[snapshot.key]) {
                    partyPositions[snapshot.key].targetAbsX = data.absX;
                    partyPositions[snapshot.key].targetY = data.y;
                    partyPositions[snapshot.key].facingRight = data.facingRight;
                    partyPositions[snapshot.key].isGrounded = data.isGrounded;
                    partyPositions[snapshot.key].updatedAt = data.updatedAt;
                    partyPositions[snapshot.key].avatar = data.avatar;
                    // 他のプレイヤーが新しいメッセージを送信したかチェック
                    if (data.msgId && partyPositions[snapshot.key].msgId !== data.msgId) {
                        partyPositions[snapshot.key].message = data.message;
                        partyPositions[snapshot.key].messageTimer = 180; // 新しいメッセージが来たらタイマーをリセット
                        partyPositions[snapshot.key].msgId = data.msgId;
                    }
                    partyPositions[snapshot.key].isTyping = data.isTyping;
                } else {
                    partyPositions[snapshot.key] = { ...data, drawAbsX: data.absX, drawY: data.y };
                }
            }
        });

        posRef.on('child_removed', (snapshot) => { delete partyPositions[snapshot.key]; });
        
        const enemiesRef = db.ref('parties/' + currentPartyId + '/enemiesDefeated');
        enemiesDefeatedListener = enemiesRef.on('child_added', (snapshot) => {
            const enemyId = parseInt(snapshot.key);
            defeatedEnemies.add(enemyId); 
            const enemy = enemies.find(e => e.id === enemyId);
            if (enemy && !enemy.isSquished) {
                enemy.isSquished = true; enemy.squishTimer = 20;
            }
        });
    }

    function updateVillage() {
        if (keys.left) {
            player.vx = -player.speed; playerFacingRight = false;
        } else if (keys.right) {
            player.vx = player.speed; playerFacingRight = true;
        } else {
            player.vx = 0;
        }

        player.x += player.vx;

        if (player.x < 0) player.x = 0;
        if (player.x > VILLAGE_WIDTH - player.width) player.x = VILLAGE_WIDTH - player.width;

        const villageGroundY = canvas.height - 110;
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.y + player.height > villageGroundY) {
            player.y = villageGroundY - player.height;
            player.vy = 0; player.isGrounded = true;
        } else {
            player.isGrounded = false;
        }

        cameraX = player.x + player.width / 2 - canvas.width / 2;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > VILLAGE_WIDTH - canvas.width) cameraX = VILLAGE_WIDTH - canvas.width;

        const playerCenterX = player.x + player.width / 2;
        const gateMargin = 80;
        
        // ソロ門判定
        if (playerCenterX >= SOLO_GATE_X - gateMargin && playerCenterX <= SOLO_GATE_X + GATE_WIDTH + gateMargin) {
            if (!isNearSoloGate) { isNearSoloGate = true; gateActionUI.classList.remove('hidden'); }
        } else {
            if (isNearSoloGate) { isNearSoloGate = false; gateActionUI.classList.add('hidden'); }
        }

        // マルチ門判定
        if (playerCenterX >= MULTI_GATE_X - gateMargin && playerCenterX <= MULTI_GATE_X + GATE_WIDTH + gateMargin) {
            if (!isNearMultiGate) { isNearMultiGate = true; multiGateActionUI.classList.remove('hidden'); }
        } else {
            if (isNearMultiGate) { isNearMultiGate = false; multiGateActionUI.classList.add('hidden'); }
        }
        
        // ★ショップ判定
        const shopMargin = 50;
        if (playerCenterX >= SHOP_X - shopMargin && playerCenterX <= SHOP_X + SHOP_WIDTH + shopMargin) {
            if (!isNearShop) { isNearShop = true; shopActionUI.classList.remove('hidden'); }
        } else {
            if (isNearShop) { isNearShop = false; shopActionUI.classList.add('hidden'); }
        }
        
        syncMyPosition();
    }

// 吹き出しを描画する関数
    function drawSpeechBubble(ctx, text, x, y, alpha, isTyping) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = "bold 14px sans-serif";
        
        const displayText = isTyping ? "・・・" : text;
        const textWidth = ctx.measureText(displayText).width;
        const padding = 10;
        const bubbleWidth = textWidth + padding * 2;
        const bubbleHeight = 26;

        // 吹き出しの背景（白）
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.roundRect(x - bubbleWidth / 2, y - bubbleHeight - 10, bubbleWidth, bubbleHeight, 8);
        ctx.fill();
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
        ctx.stroke();

        // 吹き出しのしっぽ（下向きの三角形）
        ctx.beginPath();
        ctx.moveTo(x - 6, y - 10);
        ctx.lineTo(x + 6, y - 10);
        ctx.lineTo(x, y - 2);
        ctx.fill();

        // テキストの描画
        ctx.fillStyle = "#333"; // 文字色
        ctx.textAlign = "center";
        ctx.fillText(displayText, x, y - bubbleHeight / 2 - 4);
        ctx.restore();
    }
    
    function drawVillage() {
        const now = Date.now();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (villageBg1.complete && villageBg1.width > 0) ctx.drawImage(villageBg1, 0 - cameraX, 0, 1280, canvas.height);
        if (villageBg2.complete && villageBg2.width > 0) ctx.drawImage(villageBg2, 1280 - cameraX, 0, 1280, canvas.height);

        const villageGroundY = canvas.height - 110;
        const gateY = villageGroundY - GATE_HEIGHT;
        const shopY = villageGroundY - SHOP_HEIGHT;

        // ★ショップ描画
        const shopScreenX = SHOP_X - cameraX;
        if (shopImg.complete && shopImg.width > 0) {
            ctx.drawImage(shopImg, shopScreenX, shopY, SHOP_WIDTH, SHOP_HEIGHT);
        } else {
            ctx.fillStyle = 'purple'; ctx.fillRect(shopScreenX, shopY, SHOP_WIDTH, SHOP_HEIGHT);
        }
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('アバター変更', shopScreenX + SHOP_WIDTH / 2, shopY - 10);
        if (isNearShop) {
            ctx.fillStyle = 'rgba(153, 50, 204, 0.3)'; ctx.beginPath();
            ctx.arc(shopScreenX + SHOP_WIDTH / 2, shopY + SHOP_HEIGHT, 80, 0, Math.PI, true); ctx.fill();
        }

        // ソロ門描画
        const soloGateScreenX = SOLO_GATE_X - cameraX;
        ctx.fillStyle = '#4A2E18';
        ctx.fillRect(soloGateScreenX, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(soloGateScreenX + GATE_WIDTH - 20, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(soloGateScreenX, gateY, GATE_WIDTH, 30);
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('冒険の門', soloGateScreenX + GATE_WIDTH / 2, gateY + 22);

        if (isNearSoloGate) {
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)'; ctx.beginPath();
            ctx.arc(soloGateScreenX + GATE_WIDTH / 2, gateY + GATE_HEIGHT, 80, 0, Math.PI, true); ctx.fill();
        }

        // マルチ門描画
        const multiGateScreenX = MULTI_GATE_X - cameraX;
        ctx.fillStyle = '#2a4b7c'; 
        ctx.fillRect(multiGateScreenX, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(multiGateScreenX + GATE_WIDTH - 20, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(multiGateScreenX, gateY, GATE_WIDTH, 30);
        ctx.fillStyle = '#00FFFF'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('共闘の門(マルチ)', multiGateScreenX + GATE_WIDTH / 2, gateY + 22);

        if (isNearMultiGate) {
            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)'; ctx.beginPath();
            ctx.arc(multiGateScreenX + GATE_WIDTH / 2, gateY + GATE_HEIGHT, 80, 0, Math.PI, true); ctx.fill();
        }

        // 他プレイヤー描画
        for (let key in otherPlayers) {
            const op = otherPlayers[key];
            if (now - op.updatedAt > 5000) continue;

            if (op.targetX !== undefined) op.drawX += (op.targetX - op.drawX) * 0.2; 
            if (op.targetYOffset !== undefined) op.drawYOffset += (op.targetYOffset - op.drawYOffset) * 0.2;

            const opDrawX = op.drawX - cameraX;
            const opDrawY = villageGroundY - (op.drawYOffset || 0);

            if (opDrawX + player.width > -100 && opDrawX < canvas.width + 100) {
                const opAvatarKey = (op.avatar && avatars[op.avatar]) ? op.avatar : 'default';
                let opImg = op.isGrounded ? avatars[opAvatarKey].walk : avatars[opAvatarKey].jump;

                ctx.save();
                if (opImg.complete && opImg.width > 0) {
                    if (op.facingRight) {
                        ctx.drawImage(opImg, opDrawX, opDrawY, player.width, player.height);
                    } else {
                        ctx.translate(opDrawX + player.width / 2, opDrawY + player.height / 2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(opImg, -player.width / 2, -player.height / 2, player.width, player.height);
                    }
                } else {
                    ctx.fillStyle = 'orange'; ctx.fillRect(opDrawX, opDrawY, player.width, player.height);
                }
                ctx.restore();

                ctx.fillStyle = '#00FFCC'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                const opName = op.name || "プレイヤー";
                const opLevel = op.level || 1;
                ctx.fillText(opName + " Lv." + opLevel, opDrawX + player.width / 2, opDrawY - 8);

                // 吹き出しの描画（他プレイヤー）
                if (op.isTyping) {
                    drawSpeechBubble(ctx, "", opDrawX + player.width / 2, opDrawY - 15, 1, true);
                } else if (op.messageTimer > 0) {
                    op.messageTimer--;
                    // 残り30フレーム(0.5秒)を切ったら徐々に透明にする（フェードアウト）
                    let alpha = op.messageTimer > 30 ? 1 : op.messageTimer / 30;
                    drawSpeechBubble(ctx, op.message, opDrawX + player.width / 2, opDrawY - 15, alpha, false);
                }
            }
        }

        // 自分描画
        const myAv = avatars[currentAvatar] || avatars['default'];
        let currentImg = player.isGrounded ? myAv.walk : myAv.jump;
        const drawX = player.x - cameraX;

        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, drawX, player.y, player.width, player.height);
            } else {
                ctx.translate(drawX + player.width / 2, player.y + player.height / 2);
                ctx.scale(-1, 1);
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = 'blue'; ctx.fillRect(drawX, player.y, player.width, player.height);
        }

        ctx.fillStyle = '#FFFF00'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(playerName + " Lv." + playerLevel, drawX + player.width / 2, player.y - 8);
        // 吹き出しの描画（自分）
        if (myIsTyping) {
            drawSpeechBubble(ctx, "", drawX + player.width / 2, player.y - 15, 1, true);
        } else if (myMessageTimer > 0) {
            myMessageTimer--;
            let alpha = myMessageTimer > 30 ? 1 : myMessageTimer / 30;
            drawSpeechBubble(ctx, myLatestMessage, drawX + player.width / 2, player.y - 15, alpha, false);
        }
    }

    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const isStage6 = (distance >= getDistance('s6') && distance < getDistance('s7'));
            const gap = isStage6 ? -2 : gameRandom() * 100 + 50; 
            const yOffset = isStage6 ? 0 : (gameRandom() - 0.5) * 150;
            
            let newY = lastPlatform.y + yOffset;
            const width = gameRandom() * 300 + 150; 
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });
            // 0m〜3000mの間のみ出現判定を行う
            if (distance >= 0 && distance <= 3000) {
                let spawnRoll = gameRandom();
                let matType = null;

                if (spawnRoll < 0.005) {
                    matType = 'hikariFruit'; // 超低確率 (0.5%)
                } else if (spawnRoll < 0.035) {
                    matType = 'blueButterfly'; // 低確率 (3%)
                } else if (spawnRoll < 0.135) {
                    matType = 'yumeyuri'; // たまに (10%)
                }

                if (matType) {
                    const materialOffset = 37; // 足場の見た目に合わせるためのオフセット
                    mapMaterials.push({
                        type: matType,
                        x: newX + width / 2 - (MATERIAL_SIZE / 2),
                        y: newY - MATERIAL_SIZE + materialOffset, // オフセットを追加して足場に接地させる
                        width: MATERIAL_SIZE,
                        height: MATERIAL_SIZE
                    });
                }
            }

            if (gameRandom() < 0.5) { 
                let enemyType = 'normal';
                
                // === 変更: ステージごとの出現敵判定 ===
                if (distance >= getDistance('s7')) {
                    let rand = gameRandom();
                    if (rand < 0.3) enemyType = 'kinoko'; // 30%できのこマン
                    else if (rand < 0.6) enemyType = 'hopper';
                    else enemyType = 'normal';
                } else if (distance >= getDistance('s4') && distance < getDistance('s5')) {
                    enemyType = gameRandom() < 0.5 ? 'normal' : 'hopper'; 
                } else if (distance >= getDistance('s2')) {
                    enemyType = 'hopper';
                }
                
                // 敵のサイズを種類ごとに調整 (きのこマンは少し大きめの70x65に設定)
                const eWidth = (enemyType === 'kinoko') ? 70 : 60;
                const eHeight = (enemyType === 'hopper') ? 50 : ((enemyType === 'kinoko') ? 65 : 40);
                const enemyOffset = 37; 
                const eId = enemiesGeneratedCount++; 
                const alreadyDefeated = defeatedEnemies.has(eId); 

                enemies.push({
                    id: eId, 
                    type: enemyType, x: newX + width / 2, y: newY - eHeight + enemyOffset,
                    width: eWidth, height: eHeight, spawnY: newY + enemyOffset,
                    vy: 0, isGrounded: true, 
                    jumpTimer: (enemyType === 'hopper') ? Math.floor(gameRandom() * 40) + 30 : 0, 
                    hp: (enemyType === 'kinoko') ? 2 : 1, // ★追加: きのこマンは2回踏むためHP2
                    shootTimer: (enemyType === 'kinoko') ? 60 : 0, // ★追加: 初回発射までの時間
                    yoroiState: (enemyType === 'yoroi') ? 'stand' : null,
                    stateTimer: 0,
                    yoroiFacingLeft: true,
                    isSquished: alreadyDefeated, 
                    squishTimer: alreadyDefeated ? 0 : 0 
                });
                // ======================================
            } else if (isStage6 && gameRandom() < 0.7) {
                const cactusSize = 70; const embedAmount = 37; 
                cacti.push({ x: newX + width / 2, y: newY - cactusSize + embedAmount, width: cactusSize, height: cactusSize });
            }
            
            const isStage3 = (distance >= getDistance('s3') && distance < getDistance('s4'));
            if (isStage3 && gameRandom() < 0.4) { 
                icicles.push({ x: newX + gameRandom() * (width - 40) + 20, y: 0, width: 30, height: 80, vy: 0, isFalling: false }); 
            }
            
            if (gameRandom() < 0.3) { 
                const boxSize = 60; const embedAmount = 45;
                boxes.push({ x: newX + width / 2 + 80, y: newY - boxSize + embedAmount, width: boxSize, height: boxSize });
            }
        }
    }
    
    function update() {
        if (gameState === 'VILLAGE') { updateVillage(); return; }
        if (gameState !== 'PLAYING') return;

        // === ここから変更：ステージ切り替え判定 & ホワイトフェード処理 ===
        let newBgImage = bgImage1;
        let newStageNameText = "アスター平原";

       if (distance >= getDistance('s12')) {
            newBgImage = bgImage12; newStageNameText = "サングローブ地区";
        } else if (distance >= getDistance('s11')) {
            newBgImage = bgImage11; newStageNameText = "ロイズの館～出口～";
        } else if (distance >= getDistance('s10')) {
            newBgImage = bgImage10; newStageNameText = "ロイズの館";
        if (distance >= getDistance('s9')) {
            newBgImage = bgImage9; newStageNameText = "ロイズの館～入り口～";
        } else if (distance >= getDistance('s8')) {
            newBgImage = bgImage8; newStageNameText = "パライドタウン";
        } else if (distance >= getDistance('s7')) {
            newBgImage = bgImage7; newStageNameText = "ディングルの森";
        } else if (distance >= getDistance('s5')) {
            newBgImage = bgImage5; newStageNameText = "グリオン砂漠";
        } else if (distance >= getDistance('s4')) {
            newBgImage = bgImage4; newStageNameText = "レニリアの森";
        } else if (distance >= getDistance('s3')) {
            newBgImage = bgImage3; newStageNameText = "オロ雪原";
        } else if (distance >= getDistance('s2')) {
            newBgImage = bgImage2; newStageNameText = "ヴィリカ海岸";
        }

        // 新しいステージの境界に入ったらフェードアウトを開始
        if (newBgImage !== targetBgImage && fadeState === 'none') {
            targetBgImage = newBgImage;
            nextStageName = newStageNameText;
            fadeState = 'fadeout';
        }

        // フェードアニメーション計算
        if (fadeState === 'fadeout') {
            whiteFadeAlpha += 0.02;
            if (whiteFadeAlpha >= 1) {
                whiteFadeAlpha = 1;
                currentBgImage = targetBgImage; // 画面が真っ白になった瞬間に背景を切り替え
                stageNameEl.innerText = nextStageName + (isMultiplayer ? "(マルチ)" : "");
                fadeState = 'fadein';
            }
        } else if (fadeState === 'fadein') {
            whiteFadeAlpha -= 0.02;
            if (whiteFadeAlpha <= 0) {
                whiteFadeAlpha = 0;
                fadeState = 'none';
            }
        }
        // === 変更ここまで ===

        // ▼ 今回追加・変更した処理（ガード中の移動制限） ▼
        if (keys.guard && player.isGrounded && player.counterTimer <= 0) {
            player.isGuarding = true;
            player.vx = 0; // ガード中は移動不可
        } else {
            player.isGuarding = false;
            if (keys.left) { player.vx = -player.speed; playerFacingRight = false; } 
            else if (keys.right) { player.vx = player.speed; playerFacingRight = true; } 
            else { player.vx = 0; }
        }

        // ▼ 今回追加・変更した処理（タイマー更新と体幹ゲージ回復） ▼
        if (player.guardTimer > 0) player.guardTimer--;
        if (player.counterTimer > 0) player.counterTimer--;
        if (postureGauge > 0 && !player.isGuarding && player.counterTimer <= 0) {
            postureGauge -= 0.5; // 自然回復
            if (postureGauge < 0) postureGauge = 0;
            updateStatusUI();
        }
        // ▲ ここまで ▲

        player.x += player.vx;
        if (player.x < 0) player.x = 0;

        if (distance >= getDistance('s5') && distance < getDistance('s7')) {
            if (!isWindy && !windWarning) {
                if (Math.random() < 0.005) { windWarning = true; windTimer = 60; }
            } else if (windWarning) {
                windTimer--; if (windTimer <= 0) { windWarning = false; isWindy = true; windTimer = 150; }
            } else if (isWindy) {
                windTimer--; player.x -= 4.0; if (player.x < 0) player.x = 0;
                if (windTimer <= 0) { isWindy = false; }
            }
        }

        player.vy += player.gravity; player.y += player.vy; player.isGrounded = false;

        // 1. 敵の挙動更新（ジャンプと弾の発射）
        enemies.forEach(e => {
            if (e.isSquished) { e.squishTimer--; return; }
            if (e.type === 'hopper') {
                if (e.isGrounded) {
                    e.jumpTimer--; if (e.jumpTimer <= 0) { e.vy = -11; e.isGrounded = false; }
                } else {
                    e.vy += 0.5; e.y += e.vy;
                    if (e.y >= e.spawnY - e.height) { e.y = e.spawnY - e.height; e.vy = 0; e.isGrounded = true; e.jumpTimer = 80; }
                }
            } else if (e.type === 'kinoko') {
                // プレイヤーとの距離を計算（X座標の差が800以内なら「見つけた」と判定）
                const distToPlayerX = Math.abs((player.x + player.width / 2) - (e.x + e.width / 2));
                if (distToPlayerX < 800) {
                    e.shootTimer--;
                    if (e.shootTimer <= 0) {
                        e.shootTimer = 150; // 次の弾を撃つまでの間隔 (約2.5秒)
                        // プレイヤーの方向に向けて弾を飛ばす
                        const dx = (player.x + player.width / 2) - (e.x + e.width / 2);
                        const dy = (player.y + player.height / 2) - (e.y + e.height / 2);
                        const angle = Math.atan2(dy, dx);
                        const speed = 4; // 弾のスピード
                        enemyProjectiles.push({
                            x: e.x + e.width / 2,
                            y: e.y + e.height / 2,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            radius: 8
                        });
                    }
                }
            } else if (e.type === 'yoroi') {
                const distX = (player.x + player.width / 2) - (e.x + e.width / 2);
                const absDistX = Math.abs(distX);
                
                // 攻撃中以外は常にプレイヤーの方向を向く
                if (e.yoroiState !== 'attack') {
                    e.yoroiFacingLeft = (distX < 0);
                }

                if (e.yoroiState === 'stand') {
                    // プレイヤーが近づいたら（距離300以内）構え状態へ
                    if (absDistX <= 300) {
                        e.yoroiState = 'ready';
                        e.stateTimer = 30; // 構え時間（0.5秒）
                    }
                } else if (e.yoroiState === 'ready') {
                    e.stateTimer--;
                    if (e.stateTimer <= 0) {
                        e.yoroiState = 'attack';
                        e.stateTimer = 40; // 攻撃時間
                    }
                } else if (e.yoroiState === 'attack') {
                    e.stateTimer--;
                    
                    // 攻撃判定枠の生成 (向いている方向の前方120pxに攻撃判定)
                    const attackRangeX = 120;
                    let attackRect = {
                        x: e.yoroiFacingLeft ? e.x - attackRangeX : e.x + e.width,
                        y: e.y,
                        width: attackRangeX,
                        height: e.height
                    };
                    
                    // ▼ 今回追加・変更した処理（ジャストガード・通常ガード判定） ▼
                    if (player.x < attackRect.x + attackRect.width && player.x + player.width > attackRect.x &&
                        player.y < attackRect.y + attackRect.height && player.y + player.height > attackRect.y) {
                        
                        if (player.counterTimer > 0) {
                            // カウンター中（無敵）は何もしない
                        } else if (player.isGuarding) {
                            if (player.guardTimer > 0) {
                                // ★ジャストガード成功（カウンター）★
                                player.counterTimer = 40; 
                                e.hp = 0;
                                e.isSquished = true;
                                e.squishTimer = 20;
                                coins += 50; // ボーナスコイン
                                earnedCoinsInRun += 50;
                                updateStatusUI();
                                
                                if (isMultiplayer && currentPartyId && db) {
                                    db.ref(`parties/${currentPartyId}/enemiesDefeated/${e.id}`).set(true);
                                }
                            } else {
                                // ★通常ガード（体幹ゲージが溜まる）★
                                postureGauge += 30;
                                updateStatusUI();
                                
                                if (postureGauge >= MAX_POSTURE) {
                                    gameOver(); // 体幹崩れ -> ゲームオーバー
                                } else {
                                    // ノックバックさせて連続ヒットを防ぐ
                                    player.x += e.yoroiFacingLeft ? -25 : 25;
                                    e.yoroiState = 'stand';
                                    e.stateTimer = 0;
                                }
                            }
                        } else {
                            gameOver(); // ガードしていなければゲームオーバー
                        }
                    }
                    // ▲ ここまで ▲

                    if (e.stateTimer <= 0) {
                        e.yoroiState = 'stand'; // 攻撃が終わったら立ち状態へ戻る
                    }
                }
            }
        });

        // 2. 弾の移動とプレイヤーへの当たり判定
        enemyProjectiles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            const hitMargin = 8;
            if (p.x + p.radius > player.x + hitMargin && p.x - p.radius < player.x + player.width - hitMargin &&
                p.y + p.radius > player.y + hitMargin && p.y - p.radius < player.y + player.height - hitMargin) {
                gameOver();
            }
        });

        // 3. 敵との接触・踏みつけ判定
        enemies.forEach(e => {
            if (e.isSquished) return;
            const hitboxMargin = 10; 
            if (player.x + hitboxMargin < e.x + e.width && player.x + player.width - hitboxMargin > e.x &&
                player.y + hitboxMargin < e.y + e.height && player.y + player.height - hitboxMargin > e.y) {

                if (e.type === 'yoroi') {
                    gameOver();
                    return;
                }
                
                // プレイヤーが落下中で、敵の上部を踏んだ場合
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.hp--; // HPを減らす
                    player.vy = player.jumpPower * 0.8; // プレイヤーはバウンドする
                    player.isGrounded = false;
                    
                    if (e.hp <= 0) {
                        e.isSquished = true; 
                        e.squishTimer = 20; 
                        // きのこマンなら20コイン、バッタは15、通常は8
                        const coinValue = (e.type === 'kinoko') ? 20 : ((e.type === 'hopper') ? 15 : 8); 
                        coins += coinValue;
                        earnedCoinsInRun += coinValue;
                        updateStatusUI();
                        if (isMultiplayer && currentPartyId && db) {
                            db.ref(`parties/${currentPartyId}/enemiesDefeated/${e.id}`).set(true);
                        }
                    }
                } else { 
                    gameOver(); 
                }
            }
        });

        platforms.forEach(p => {
            const footOffset = 37; const marginX = 15;
            if (player.x + marginX < p.x + p.width && player.x + player.width - marginX > p.x &&
                player.y < p.y + p.height && player.y + player.height - footOffset > p.y) {
                if (player.vy > 0) {
                    player.isGrounded = true; player.vy = 0; player.y = p.y - player.height + footOffset;
                } else if (player.vy < 0) { player.vy = 0; player.y = p.y + p.height; }
            }
        });

        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold; player.x = scrollThreshold;
            totalScrollX += offset;
            let addedDist = offset * 0.05;
            distance += addedDist; playerExp += addedDist;
            distanceEl.innerText = Math.floor(distance);
            
            checkLevelUp();
            platforms.forEach(p => p.x -= offset); enemies.forEach(e => e.x -= offset);
            icicles.forEach(i => i.x -= offset); boxes.forEach(b => b.x -= offset); cacti.forEach(c => c.x -= offset);
            mapMaterials.forEach(m => m.x -= offset);
            activeCollectEffects.forEach(e => e.x -= offset);
            enemyProjectiles.forEach(p => p.x -= offset);
            bgOffset += offset * 0.5;
        }

        if (platforms[0].x + platforms[0].width < -100) platforms.shift();

        enemyProjectiles = enemyProjectiles.filter(p => p.x + p.radius >= -100 && p.x - p.radius <= canvas.width + 100 && p.y <= canvas.height + 100);
        
        enemies = enemies.filter(e => (e.x + e.width >= -100) && (!e.isSquished || e.squishTimer > 0));
        icicles = icicles.filter(i => (i.x + i.width >= -100) && i.y < canvas.height);
        boxes = boxes.filter(b => b.x + b.width >= -100);
        cacti = cacti.filter(c => c.x + c.width >= -100);
        mapMaterials = mapMaterials.filter(m => m.x + m.width >= -100);

        cacti.forEach(c => {
            const hitboxMargin = 15;
            if (player.x + hitboxMargin < c.x + c.width && player.x + player.width - hitboxMargin > c.x &&
                player.y + hitboxMargin < c.y + c.height && player.y + player.height - hitboxMargin > c.y) {
                gameOver();
            }
        });

        // つららの落下・当たり判定処理
        icicles.forEach(icicle => {
            // プレイヤーが近づいたら落下開始（X座標の距離が300px以内）
            if (!icicle.isFalling && Math.abs((player.x + player.width / 2) - (icicle.x + icicle.width / 2)) < 300) {
                icicle.isFalling = true;
            }

            // 落下中の移動処理
            if (icicle.isFalling) {
                icicle.vy += 0.6; // 加速度（落下の速さ）
                icicle.y += icicle.vy;
            }

            // プレイヤーとの当たり判定
            const hitMargin = 5;
            if (player.x + hitMargin < icicle.x + icicle.width &&
                player.x + player.width - hitMargin > icicle.x &&
                player.y + hitMargin < icicle.y + icicle.height &&
                player.y + player.height - hitMargin > icicle.y) {
                gameOver();
            }
        });

        boxes.forEach(b => {
            const marginX = 15; const footOffset = 37; const standOffset = 20;
            const pLeft = player.x + marginX; const pRight = player.x + player.width - marginX;
            const pTop = player.y; const pBottom = player.y + player.height - footOffset + standOffset;

            if (pLeft < b.x + b.width && pRight > b.x && pTop < b.y + b.height && pBottom > b.y) {
                if (player.vy > 0 && pBottom - player.vy <= b.y + 25) {
                    player.isGrounded = true; player.vy = 0; player.y = b.y - player.height + footOffset - standOffset;
                } else {
                    if (player.vx > 0) { player.x = b.x - player.width + marginX; } 
                    else if (player.vx < 0) { player.x = b.x + b.width - marginX; }
                }
            }
        });
        
        generateMap();

        if (player.y > canvas.height) gameOver();
        syncMyPosition();
    }

    function draw() {
        if (gameState === 'VILLAGE') { drawVillage(); return; }

        if (currentBgImage.complete && currentBgImage.width > 0) {
            const scale = canvas.height / currentBgImage.height;
            const scaledWidth = currentBgImage.width * scale;
            const xOffset = bgOffset % scaledWidth;
            
            ctx.drawImage(currentBgImage, -xOffset, 0, scaledWidth, canvas.height);
            ctx.drawImage(currentBgImage, -xOffset + scaledWidth, 0, scaledWidth, canvas.height);
            if (scaledWidth - xOffset < canvas.width) {
                ctx.drawImage(currentBgImage, -xOffset + scaledWidth * 2, 0, scaledWidth, canvas.height);
            }
        } else { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        if (whiteFadeAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${whiteFadeAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        platforms.forEach(p => {
            const imgHeight = 100; 
            if (platformImg.complete && platformImg.width > 0) {
                ctx.drawImage(platformImg, p.x, p.y, p.width, imgHeight);
                if (p.height > imgHeight) { ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y + imgHeight, p.width, p.height - imgHeight); }
            } else {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#228B22'; ctx.fillRect(p.x, p.y, p.width, 15);
            }
        });
        
        // ▼▼▼ 敵の描画処理 ▼▼▼
        enemies.forEach(e => {
            if (e.type === 'hopper') {
                let currentEnemyImg = e.isGrounded ? hopperGroundImg : hopperJumpImg;
                if (currentEnemyImg.complete && currentEnemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.drawImage(currentEnemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.drawImage(currentEnemyImg, e.x, e.y, e.width, e.height); }
                } else {
                    ctx.fillStyle = 'green';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.fillRect(e.x, e.y, e.width, e.height); }
                }

            } else if (e.type === 'yoroi') {
                let imgToDraw = yoroiStandImg;
                if (e.yoroiState === 'ready') imgToDraw = yoroiReadyImg;
                else if (e.yoroiState === 'attack') imgToDraw = yoroiAttackImg;

                if (imgToDraw.complete && imgToDraw.width > 0) {
                    ctx.save();
                    
                    let drawWidth = e.width;
                    let drawX = e.x;
                    if (e.yoroiState === 'attack') {
                        drawWidth = e.width + 120; 
                        if (e.yoroiFacingLeft) {
                            drawX = e.x - 120; 
                        }
                    }

                    if (e.yoroiFacingLeft) {
                        ctx.drawImage(imgToDraw, drawX, e.y, drawWidth, e.height);
                    } else {
                        ctx.translate(drawX + drawWidth / 2, e.y + e.height / 2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(imgToDraw, -drawWidth / 2, -e.height / 2, drawWidth, e.height);
                    }
                    ctx.restore();
                } else {
                    ctx.fillStyle = (e.yoroiState === 'attack') ? 'red' : ((e.yoroiState === 'ready') ? 'yellow' : 'gray');
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                }
                
            } else if (e.type === 'kinoko') {
                if (kinokoImg.complete && kinokoImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; 
                        ctx.drawImage(kinokoImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        if (e.hp === 1 && Math.floor(Date.now() / 150) % 2 === 0) {
                            ctx.globalAlpha = 0.5;
                        }
                        ctx.drawImage(kinokoImg, e.x, e.y, e.width, e.height);
                        ctx.globalAlpha = 1.0;
                    }
                } else {
                    ctx.fillStyle = (e.hp === 1) ? 'orange' : 'brown';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.fillRect(e.x, e.y, e.width, e.height); }
                }
            } else {
                if (enemyImg.complete && enemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.drawImage(enemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else { ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height); }
                } else {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y, e.width, e.height);
                        ctx.fillStyle = 'white'; ctx.fillRect(e.x + 5, e.y + 5, 5, 5); ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
                    }
                }
            }
        });

        // 敵の弾の描画
        if (typeof enemyProjectiles !== 'undefined') {
            enemyProjectiles.forEach(p => {
                ctx.fillStyle = '#FF4500'; 
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#FFD700'; 
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }
        // ▲▲▲ ここまで ▲▲▲

        icicles.forEach(icicle => {
            ctx.fillStyle = '#E0FFFF'; ctx.beginPath();
            ctx.moveTo(icicle.x, icicle.y); ctx.lineTo(icicle.x + icicle.width, icicle.y); ctx.lineTo(icicle.x + icicle.width / 2, icicle.y + icicle.height);
            ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#B0E0E6'; ctx.lineWidth = 2; ctx.stroke();
        });
        boxes.forEach(b => {
            if (boxImg.complete && boxImg.width > 0) { ctx.drawImage(boxImg, b.x, b.y, b.width, b.height); } 
            else { ctx.fillStyle = '#8B4513'; ctx.fillRect(b.x, b.y, b.width, b.height); }
        });

        cacti.forEach(c => {
            if (cactusImg.complete && cactusImg.width > 0) { ctx.drawImage(cactusImg, c.x, c.y, c.width, c.height); } 
            else { ctx.fillStyle = 'green'; ctx.fillRect(c.x, c.y, c.width, c.height); }
        });

        if (isMultiplayer && currentPartyId) {
            const now = Date.now();
            const myAbsXBase = totalScrollX;

            for (let key in partyPositions) {
                const op = partyPositions[key];
                if (now - op.updatedAt > 5000) continue;

                if (op.targetAbsX !== undefined) op.drawAbsX += (op.targetAbsX - op.drawAbsX) * 0.2;
                if (op.targetY !== undefined) op.drawY += (op.targetY - op.drawY) * 0.2;

                const opDrawX = op.drawAbsX - myAbsXBase;
                const opDrawY = op.drawY;

                if (opDrawX + player.width > -100 && opDrawX < canvas.width + 100) {
                    const opAvatarKey = (op.avatar && avatars[op.avatar]) ? op.avatar : 'default';
                    let opImg = op.isGrounded ? avatars[opAvatarKey].walk : avatars[opAvatarKey].jump;
                    
                    ctx.save();
                    if (opImg.complete && opImg.width > 0) {
                        if (op.facingRight) {
                            ctx.drawImage(opImg, opDrawX, opDrawY, player.width, player.height);
                        } else {
                            ctx.translate(opDrawX + player.width / 2, opDrawY + player.height / 2);
                            ctx.scale(-1, 1);
                            ctx.drawImage(opImg, -player.width / 2, -player.height / 2, player.width, player.height);
                        }
                    } else {
                        ctx.fillStyle = 'orange'; ctx.fillRect(opDrawX, opDrawY, player.width, player.height);
                    }
                    ctx.restore();

                    ctx.fillStyle = '#00FFCC'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                    const opName = op.name || "プレイヤー";
                    ctx.fillText(opName, opDrawX + player.width / 2, opDrawY - 8);
                }
            }
        }
        
        // ▼▼▼ プレイヤーの描画（ガード・カウンター画像対応版） ▼▼▼
        const myAv = avatars[currentAvatar] || avatars['default'];
        let currentImg = player.isGrounded ? myAv.walk : myAv.jump;

        // ガード中・カウンター中の画像切り替え
        if (player.counterTimer > 0 && counterImg.complete && counterImg.width > 0) {
            currentImg = counterImg;
        } else if (player.isGuarding && guardImg.complete && guardImg.width > 0) {
            currentImg = guardImg;
        }

        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) { ctx.drawImage(currentImg, player.x, player.y, player.width, player.height); } 
            else {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2); 
                ctx.scale(-1, 1); 
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
        } else { 
            ctx.fillStyle = player.counterTimer > 0 ? 'yellow' : (player.isGuarding ? 'gray' : 'blue'); 
            ctx.fillRect(player.x, player.y, player.width, player.height); 
        }
        // ▲▲▲ ここまで ▲▲▲

        // 素材の描画
        mapMaterials.forEach(m => {
            let img;
            if (m.type === 'yumeyuri') img = yumeyuriImg;
            else if (m.type === 'blueButterfly') img = blueButterflyImg;
            else if (m.type === 'hikariFruit') img = hikariFruitImg;

            if (img.complete && img.width > 0) {
                ctx.drawImage(img, m.x, m.y, m.width, m.height);
            } else {
                ctx.fillStyle = 'pink'; 
                ctx.fillRect(m.x, m.y, m.width, m.height);
            }
        });
        
        if (windWarning) {
            ctx.fillStyle = "rgba(255, 69, 0, 0.8)"; ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("⚠️ 突風注意！", canvas.width / 2, canvas.height / 3);
        } else if (isWindy) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)"; ctx.font = "bold 40px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("༄༅༄༅ 突風発生中！ ༄༅༄༅", canvas.width / 2, canvas.height / 3);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 3;
            for (let i = 0; i < 6; i++) {
                let windX = Math.random() * canvas.width; let windY = Math.random() * canvas.height;
                ctx.beginPath(); ctx.moveTo(windX, windY); ctx.lineTo(windX - (100 + Math.random() * 150), windY); ctx.stroke();
            }
        }
        if (typeof updateEffectsPosition === 'function') {
            updateEffectsPosition();
        }
} 

// === バッグ画面の開閉ロジック ===
const inventoryModal = document.getElementById('inventory-modal');
const inventoryContainer = document.getElementById('inventory-items-container');

document.getElementById('btn-bag').addEventListener('click', () => {
    inventoryContainer.innerHTML = '';
    
    const allItemsInfo = [
        { id: 'yumeyuri', name: 'ユメユリ', img: yumeyuriImg.src, count: myInventory.yumeyuri },
        { id: 'blueButterfly', name: 'ブルーバタフライ', img: blueButterflyImg.src, count: myInventory.blueButterfly },
        { id: 'hikariFruit', name: 'ヒカリノ果実', img: hikariFruitImg.src, count: myInventory.hikariFruit }
    ];

    const ownedItems = allItemsInfo.filter(item => item.count > 0);
    const MAX_SLOTS = 50; 

    for (let i = 0; i < MAX_SLOTS; i++) {
        const div = document.createElement('div');
        div.style.background = 'rgba(255,255,255,0.1)';
        div.style.padding = '5px';
        div.style.borderRadius = '8px';
        div.style.textAlign = 'center';
        div.style.width = '75px';
        div.style.height = '85px'; 
        div.style.boxSizing = 'border-box';
        div.style.border = '1px solid #aaa';

        if (i < ownedItems.length) {
            const item = ownedItems[i];
            div.innerHTML = `
                <img src="${item.img}" style="width: 35px; height: 35px; object-fit: contain; margin-bottom: 2px;">
                <div style="color:white; font-size: 10px; font-weight:bold; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                <div style="color:#FFD700; font-size: 12px; font-weight:bold;">x ${item.count}</div>
            `;
        } else {
            div.innerHTML = '';
            div.style.background = 'rgba(0,0,0,0.3)';
        }
        
        inventoryContainer.appendChild(div);
    }
    inventoryModal.classList.remove('hidden');
});

document.getElementById('btn-close-inventory').addEventListener('click', () => {
    inventoryModal.classList.add('hidden');
});

    // === 採集ロジック ===
    function tryCollectMaterial() {
        if (gameState !== 'PLAYING' && gameState !== 'VILLAGE') return;
        
        const collectRange = 60; // 採集できる距離
        const playerCenterX = player.x + player.width / 2;
        const playerCenterY = player.y + player.height / 2;

        for (let i = 0; i < mapMaterials.length; i++) {
            let m = mapMaterials[i];
            const matCenterX = m.x + m.width / 2;
            const matCenterY = m.y + m.height / 2;

            // プレイヤーと素材の距離をチェック
            if (Math.abs(playerCenterX - matCenterX) < collectRange &&
                Math.abs(playerCenterY - matCenterY) < collectRange) {
                
                // インベントリに追加
                myInventory[m.type]++;
                
                // 効果音を鳴らす
                collectSound.currentTime = 0;
                collectSound.play().catch(err => { console.warn("Collect sound failed:", err); });

                // 素材のあった場所（画面座標）でエフェクト表示
                showCollectEffect(matCenterX, matCenterY);

                // マップから削除
                mapMaterials.splice(i, 1);
                
                saveGame();
                break; // 1回につき1個だけ採集
            }
        }
    }

    let activeCollectEffects = [];

// 素材があった位置（x, y）にエフェクトを発生させる関数
function showCollectEffect(x, y) {
    const container = document.getElementById('game-container');
    const img = document.createElement('img');
    
    // キャッシュ対策用のクエリパラメータを付けて毎回最初からGIFを再生
    img.src = "tktk_Recovery_17.gif?" + Date.now();
    img.style.position = 'absolute';
    img.style.pointerEvents = 'none';
    img.style.zIndex = '80';
    img.style.transform = 'translate(-50%, -50%)';
    img.style.width = '100px';
    img.style.height = '100px';
    img.style.mixBlendMode = 'screen';

    container.appendChild(img);

    const effectObj = {
        element: img,
        x: x,
        y: y,
        worldX: (gameState === 'VILLAGE') ? x + cameraX : 0
    };

    activeCollectEffects.push(effectObj);

    // 1秒後に自動削除
    setTimeout(() => {
        if (img.parentNode) {
            img.parentNode.removeChild(img);
        }
        activeCollectEffects = activeCollectEffects.filter(e => e !== effectObj);
    }, 1000);
}

// 毎フレーム、キャンバス上の描画位置を更新する関数
function updateEffectsPosition() {
    const scaleX = canvas.clientWidth / canvas.width;
    const scaleY = canvas.clientHeight / canvas.height;

    activeCollectEffects.forEach(e => {
        let currentX = e.x;
        if (gameState === 'VILLAGE') {
            currentX = e.worldX - cameraX;
        }
        e.element.style.left = (currentX * scaleX) + 'px';
        e.element.style.top = (e.y * scaleY) + 'px';
    });
}
    
    function loop(timestamp) {
        if (gameState === 'PLAYING' || gameState === 'VILLAGE') {
            animationId = requestAnimationFrame(loop);
            if (!timestamp) timestamp = performance.now();
            if (!lastTime) lastTime = timestamp;

            const elapsed = timestamp - lastTime;
            if (elapsed >= frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);
                update();
                draw();
            }
        }
    }
</script>
