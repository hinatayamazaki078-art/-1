<!DOCTYPE html>
<html lang="ja">　
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アクションゲーム</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 8vw;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
        }

        button.menu-btn {
            background-color: #ff4500;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 4vw;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        button.menu-btn:active {
            transform: translateY(2px);
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
        }

        #game-pad {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left));
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none;
        }

        .pad-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 85px;
            height: 85px;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }
        @media screen and (orientation: landscape) {
            #portrait-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="score-display" class="hidden">距離: <span id="distance">0</span>m</div>

    <div id="game-pad" class="hidden">
        <div class="pad-group">
            <div id="btn-left" class="action-btn">◀</div>
            <div id="btn-right" class="action-btn">▶</div>
        </div>
        <div class="pad-group">
            <div id="btn-jump" class="action-btn">▲</div>
        </div>
    </div>

    <div id="title-screen" class="screen">
        <h1>アクションラン</h1>
        <button id="btn-start" class="menu-btn">冒険開始</button>
        <button id="btn-ranking" class="menu-btn" onclick="alert('ランキングサーバーは未接続です\n（将来実装予定）')">ランキング</button>
        <button id="btn-avatar" class="menu-btn" onclick="alert('アバター設定画面\n（将来実装予定）')">アバター設定</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff4d4d;">GAME OVER</h1>
        <p style="font-size: 5vw; margin-bottom: 20px;">記録: <span id="final-distance">0</span>m</p>
        <button id="btn-restart" class="menu-btn">タイトルへ戻る</button>
    </div>

    <div id="portrait-warning" class="screen">
        <h2>スマホを横向きにしてください</h2>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI要素
    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const gamePad = document.getElementById('game-pad');
    const distanceEl = document.getElementById('distance');
    const finalDistanceEl = document.getElementById('final-distance');

    // メニューボタン
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', showTitle);

    // キー入力とボタン状態
    const keys = { left: false, right: false };
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') doJump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        const startAction = (e) => { e.preventDefault(); if(action === 'jump') doJump(); else keys[action] = true; };
        const endAction = (e) => { e.preventDefault(); if(action !== 'jump') keys[action] = false; };
        
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('touchstart', startAction);
        btn.addEventListener('mouseup', endAction);
        btn.addEventListener('touchend', endAction);
        btn.addEventListener('mouseleave', endAction);
    };
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');
    setupButton('btn-jump', 'jump');

    function doJump() {
        if (gameState !== 'PLAYING') return;
        if (player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }
    }

    function resize() {
    // PC相当の広い横幅（論理ピクセル）を指定（例：1000〜1280あたりで調整）
    const baseWidth = 1280; 
    
    // 実際のスマホ画面の縦横比を計算
    const aspectRatio = window.innerHeight / window.innerWidth;
    
    // 横幅を固定し、縦幅はスマホの画面比率に合わせて調整
    canvas.width = baseWidth;
    canvas.height = baseWidth * aspectRatio;
}
    window.addEventListener('resize', resize);
    
    document.addEventListener('fullscreenchange', () => { setTimeout(resize, 100); });
    document.addEventListener('webkitfullscreenchange', () => { setTimeout(resize, 100); });
    
    resize();

    // ==========================================
    // ★ 設定：背景や敵が切り替わる距離（m）
    // ==========================================
    const STAGE2_DISTANCE = 1000; 
    const STAGE3_DISTANCE = 2000; 
    const STAGE4_DISTANCE = 3000; 
    const STAGE5_DISTANCE = 4000; 

    // 背景画像の設定
    const bgImage1 = new Image();
    bgImage1.src = 'ChatGPT Image 2026年7月15日 00_45_17.png';
    const bgImage2 = new Image();
    bgImage2.src = 'stage2.png';
    const bgImage3 = new Image();
    bgImage3.src = 'stage3.png';
    const bgImage4 = new Image();
    bgImage4.src = 'stage4.png';
    const bgImage5 = new Image();
    bgImage5.src = 'stage5.png';
    const platformImg = new Image();
　　platformImg.src = 'platform.png';
    
    let currentBgImage = bgImage1;
    let bgOffset = 0;

    // プレイヤー画像の設定
    const playerImgWalk = new Image();
    playerImgWalk.src = 'si1.png';
    const playerImgJump = new Image();
    playerImgJump.src = 'si2.png';
    let playerFacingRight = true;

    // 通常の敵画像の設定
    const enemyImg = new Image();
    enemyImg.src = 'ku.png';

    // 1000m以降の敵（バッタ）画像の設定
    const hopperGroundImg = new Image();
    hopperGroundImg.src = 'バッタ地上.png';
    const hopperJumpImg = new Image();
    hopperJumpImg.src = 'バッタジャンプ.png';

    // ★BGM追加箇所: 音声オブジェクトの作成
    // ※ファイルの拡張子（.mp3, .wav, .m4aなど）に合わせて適宜変更してください
    const bgm = new Audio('伝承の丘.mp3'); 
    bgm.loop = true;          // ループ再生を有効化
    bgm.volume = 0.5;         // 音量調整（0.0〜1.0の間で設定できます）

    // ゲーム状態
    let gameState = 'TITLE';
    let animationId;
    let distance = 0;
    let lastTime = 0;
    const FPS = 60;
    const frameInterval = 1000 / FPS;
    
    // キャラクターの設定
    const player = {
        x: 50,
        y: 200,
        width: 60,
        height: 50,
        vx: 0,
        vy: 0,
        speed: 6,
        gravity: 0.8,
        jumpPower: -13,
        isGrounded: false
    };

    let platforms = [];
    let enemies = [];

    function initMap() {
        platforms = [];
        enemies = [];
        distance = 0;
        bgOffset = 0;
        currentBgImage = bgImage1;
        player.x = 50;
        player.y = 100;
        player.vx = 0;
        player.vy = 0;
        keys.left = false;
        keys.right = false;
        playerFacingRight = true; 
        
        platforms.push({ x: 0, y: canvas.height - 100, width: canvas.width, height: 100 });
    }

    function requestFullscreenAndLock(element) {
        const requestFS = element.requestFullscreen || 
                          element.webkitRequestFullscreen || 
                          element.mozRequestFullScreen || 
                          element.msRequestFullscreen;
        
        if (requestFS) {
            requestFS.call(element).then(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(err => {
                        console.warn("画面ロックに非対応の環境です:", err);
                    });
                }
            }).catch(err => {
                console.warn("フルスクリーン化に失敗しました:", err);
            });
        }
    }

    function startGame() {
        const container = document.getElementById('game-container');
        requestFullscreenAndLock(container);

        // ★BGM追加箇所: 冒険開始時にBGMを再生
        bgm.currentTime = 0; // 曲の最初から再生
        bgm.play().catch(err => {
            console.warn("BGMの再生に失敗しました（ブラウザのセキュリティ制限等）:", err);
        });

        titleScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        gamePad.classList.remove('hidden');
        gameState = 'PLAYING';
        initMap();
        
        // ▼▼▼ ここを変更 ▼▼▼
        lastTime = performance.now();
        animationId = requestAnimationFrame(loop);
        // ▲▲▲ ここを変更 ▲▲▲
    }

    function showTitle() {
        gameOverScreen.classList.add('hidden');
        titleScreen.classList.remove('hidden');
        gameState = 'TITLE';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);

        // ★BGM追加箇所: ゲームオーバー時にBGMを一時停止
        bgm.pause();

        scoreDisplay.classList.add('hidden');
        gamePad.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalDistanceEl.innerText = Math.floor(distance);
    }

    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const gap = Math.random() * 100 + 50; 
            const width = Math.random() * 300 + 150;
            const yOffset = (Math.random() - 0.5) * 150;
            let newY = lastPlatform.y + yOffset;
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });

            if (Math.random() < 0.5) {
                const isStage2OrMore = (distance >= STAGE2_DISTANCE);
                const enemyType = isStage2OrMore ? 'hopper' : 'normal';
                
                const eWidth = 60;
                const eHeight = (enemyType === 'hopper') ? 50 : 40;

                enemies.push({
                    type: enemyType,
                    x: newX + width / 2,
                    y: newY - eHeight,
                    width: eWidth,
                    height: eHeight,
                    spawnY: newY,
                    vy: 0,
                    isGrounded: true,
                    jumpTimer: (enemyType === 'hopper') ? Math.floor(Math.random() * 40) + 30 : 0,
                    isSquished: false,
                    squishTimer: 0
                });
            }
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        if (distance >= STAGE5_DISTANCE) {
            currentBgImage = bgImage5;
        } else if (distance >= STAGE4_DISTANCE) {
            currentBgImage = bgImage4;
        } else if (distance >= STAGE3_DISTANCE) {
            currentBgImage = bgImage3;
        } else if (distance >= STAGE2_DISTANCE) {
            currentBgImage = bgImage2;
        } else {
            currentBgImage = bgImage1;
        }

        if (keys.left) {
            player.vx = -player.speed;
            playerFacingRight = false; 
        } else if (keys.right) {
            player.vx = player.speed;
            playerFacingRight = true;  
        } else {
            player.vx = 0;
        }

        player.x += player.vx;
        if (player.x < 0) player.x = 0;

        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vx > 0) player.x = p.x - player.width;
                else if (player.vx < 0) player.x = p.x + p.width;
            }
        });

        player.vy += player.gravity;
        player.y += player.vy;
        player.isGrounded = false;

        enemies.forEach(e => {
            if (e.isSquished) {
                e.squishTimer--;
                return;
            }

            if (e.type === 'hopper') {
                if (e.isGrounded) {
                    e.jumpTimer--;
                    if (e.jumpTimer <= 0) {
                        e.vy = -11; 
                        e.isGrounded = false;
                    }
                } else {
                    e.vy += 0.5; 
                    e.y += e.vy;
                    if (e.y >= e.spawnY - e.height) {
                        e.y = e.spawnY - e.height;
                        e.vy = 0;
                        e.isGrounded = true;
                        e.jumpTimer = 80; 
                    }
                }
            }
        });

        enemies.forEach(e => {
            if (e.isSquished) return;

            const hitboxMargin = 10; 
            if (player.x + hitboxMargin < e.x + e.width &&
                player.x + player.width - hitboxMargin > e.x &&
                player.y + hitboxMargin < e.y + e.height &&
                player.y + player.height - hitboxMargin > e.y) {
                
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.isSquished = true;
                    e.squishTimer = 20; 
                    player.vy = player.jumpPower * 0.8; 
                    player.isGrounded = false;
                } else {
                    gameOver();
                }
            }
        });

        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vy > 0) {
                    player.isGrounded = true;
                    player.vy = 0;
                    player.y = p.y - player.height;
                } else if (player.vy < 0) {
                    player.vy = 0;
                    player.y = p.y + p.height;
                }
            }
        });

        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold;
            player.x = scrollThreshold;
            
            distance += offset * 0.05;
            distanceEl.innerText = Math.floor(distance);

            platforms.forEach(p => p.x -= offset);
            enemies.forEach(e => e.x -= offset);

            bgOffset += offset * 0.5;
        }

        if (platforms[0].x + platforms[0].width < -100) platforms.shift();
        
        enemies = enemies.filter(e => (e.x + e.width >= -100) && (!e.isSquished || e.squishTimer > 0));

        generateMap();

        if (player.y > canvas.height) {
            gameOver();
        }
    }

    function draw() {
        if (currentBgImage.complete && currentBgImage.width > 0) {
            const scale = canvas.height / currentBgImage.height;
            const scaledWidth = currentBgImage.width * scale;
            const xOffset = bgOffset % scaledWidth;
            
            ctx.drawImage(currentBgImage, -xOffset, 0, scaledWidth, canvas.height);
            ctx.drawImage(currentBgImage, -xOffset + scaledWidth, 0, scaledWidth, canvas.height);
            if (scaledWidth - xOffset < canvas.width) {
                ctx.drawImage(currentBgImage, -xOffset + scaledWidth * 2, 0, scaledWidth, canvas.height);
            }
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // プラットフォームの描画
        platforms.forEach(p => {
            if (platformImg.complete && platformImg.width > 0) {
                // 画像からテクスチャを抽出して描画する

                // --- 設定：画像内の各層の高さ（ピクセル） ---
                // 提供された画像（image_0.png）のピクセルサイズに合わせて設定
                const srcGrassHeight = 150; // 画像上部の草の層の高さ（岩や花を含む）
                const srcDirtHeight = 300;  // 画像中央の土の層の高さ（岩を含む）
                const srcRootHeight = 220;  // 画像下部の根の層の高さ
                // ---
                // ※画像の使用したい範囲に合わせて、これらの数値を調整してください。

                // 画像全体の幅と高さ
                const srcW = platformImg.width;
                const srcH = platformImg.height;

                // --- 天面の草の描画 ---
                // プラットフォームの天面。水平方向に並べる。
                for (let x = 0; x < p.width; x += srcW) {
                    let drawW = Math.min(srcW, p.width - x);
                    ctx.drawImage(platformImg, 0, 0, drawW, srcGrassHeight, p.x + x, p.y, drawW, srcGrassHeight);
                }

                // --- 土の層の描画 ---
                // 草の層の下からプラットフォームの底まで。水平と垂直に並べる。
                // 土の層はプラットフォームが深くなると繰り返して描画される。
                for (let x = 0; x < p.width; x += srcW) {
                    for (let y = 0; y < p.height - srcGrassHeight; y += srcDirtHeight) {
                        let drawW = Math.min(srcW, p.width - x);
                        let drawH = Math.min(srcDirtHeight, p.height - srcGrassHeight - y);
                        // 画像の土の部分を切り出して、プラットフォーム内の正しい位置に描画
                        ctx.drawImage(platformImg, 0, srcGrassHeight, drawW, drawH, p.x + x, p.y + srcGrassHeight + y, drawW, drawH);
                    }
                }

                // --- 根の描画 ---
                // プラットフォームの最下部に描画。ぶら下がっている表現のため、少し食い込ませる。
                let rootY = p.y + p.height; 
                for (let x = 0; x < p.width; x += srcW) {
                    let drawW = Math.min(srcW, p.width - x);
                    // 根の部分だけを切り出す (srcH - srcRootHeight)
                    ctx.drawImage(platformImg, 0, srcH - srcRootHeight, drawW, srcRootHeight, p.x + x, rootY - srcRootHeight / 2, drawW, srcRootHeight);
                }

            } else {
                // 画像が読み込まれていない場合のフォールバック（以前の矩形描画）
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#228B22';
                ctx.fillRect(p.x, p.y, p.width, 15);
                ctx.fillStyle = '#8B4513';
            }
        });
        enemies.forEach(e => {
            if (e.type === 'hopper') {
                let currentEnemyImg = e.isGrounded ? hopperGroundImg : hopperJumpImg;
                if (currentEnemyImg.complete && currentEnemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.drawImage(currentEnemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(currentEnemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    ctx.fillStyle = 'green';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillRect(e.x, e.y, e.width, e.height);
                    }
                }
            } else {
                if (enemyImg.complete && enemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.drawImage(enemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25;
                        ctx.fillStyle = 'red';
                        ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillStyle = 'red';
                        ctx.fillRect(e.x, e.y, e.width, e.height);
                        ctx.fillStyle = 'white';
                        ctx.fillRect(e.x + 5, e.y + 5, 5, 5);
                        ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
                    }
                }
            }
        });

        // --- 敵の描画処理の続き ---
        
        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2); 
                ctx.scale(-1, 1); 
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
        } else {
            ctx.fillStyle = 'blue';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
    } // <-- ここで draw() 関数をしっかり閉じる

    // ▼▼▼ 修正：draw() 関数の外に loop() 関数を独立して配置 ▼▼▼
    function loop(timestamp) {
        if (gameState === 'PLAYING') {
            // 次のフレームを要求
            animationId = requestAnimationFrame(loop);

            // timestampが取得できない場合のフォールバック
            if (!timestamp) timestamp = performance.now();
            if (!lastTime) lastTime = timestamp;

            const elapsed = timestamp - lastTime;

            // 1/60秒 (約16.67ms) 以上経過していたら更新と描画を行う
            if (elapsed >= frameInterval) {
                // 余剰時間を考慮して次回の基準時間を設定
                lastTime = timestamp - (elapsed % frameInterval);

                update();
                draw();
            }
        }
    }
    
</script>
