<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アクションゲーム - オンラインマルチプレイ</title>
    
    <!-- Firebase SDK (Compat v10) の読み込み -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ＝＝＝ ★追加：ステータスUIのスタイル ＝＝＝ */
        #status-ui {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 320px;
            height: 110px;
            background-image: url('ステータス表示.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            z-index: 30;
            pointer-events: none;
        }

        .status-avatar {
            position: absolute;
            top: 20%; 
            left: 6%; 
            width: 22%; 
            height: 64%;
            border-radius: 50%;
            background-image: url('si1.png');
            background-size: 180%;
            background-position: top center;
            background-color: white;
        }

        .status-name-level {
            position: absolute;
            top: 25%; 
            left: 38%; 
            width: 55%;
            color: #5a3c11; 
            font-weight: bold; 
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .status-bar-container {
            position: absolute;
            left: 42%; 
            width: 42%; 
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
        }

        .stamina-bar-container { top: 62%; }
        .magic-bar-container { top: 82%; }

        .status-bar {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }
        .bar-green { background-color: #32cd32; box-shadow: 0 0 5px #32cd32; }
        .bar-yellow { background-color: #ffd700; box-shadow: 0 0 5px #ffd700; }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 40;
        }

        /* ★新しいタイトル画面の設定 */
        #title-screen {
            background-image: url('タイトル画面.png'); /* 指定画像を背景に */
            background-size: cover;
            background-position: center;
            background-color: transparent;
            cursor: pointer; /* タップできることを示す指マーク */
        }

        /* ★カスタム名前入力画面用スタイル */
        #name-input-field {
            font-size: 5vw;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 2px solid #fff;
            text-align: center;
            width: 60%;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 8vw;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
        }

        button.menu-btn {
            background-color: #ff4500;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 4vw;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        button.menu-btn:active {
            transform: translateY(2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #btn-enter-gate {
            background-color: #32cd32;
            animation: pulse 1.5s infinite;
        }

        #score-display {
            position: absolute;
            top: 130px;
            left: 20px;
            font-size: 4vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
        }

        #stage-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5vw;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 5;
            pointer-events: none;
        }

        #game-pad {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left));
            box-sizing: border-box;
            z-index: 25;
            pointer-events: none;
        }

        .pad-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 85px;
            height: 85px;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }
        @media screen and (orientation: landscape) {
            #portrait-warning {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="status-ui" class="hidden">
        <div class="status-avatar"></div>
        <div class="status-name-level" onclick="changePlayerName()">
            <span id="status-name">プレイヤー</span> 
            <span id="status-level" style="margin-left: 5px;">Lv.1</span>
        </div>
        <div class="status-bar-container stamina-bar-container">
            <div id="stamina-fill" class="status-bar bar-green"></div>
        </div>
        <div class="status-bar-container magic-bar-container">
            <div id="magic-fill" class="status-bar bar-yellow"></div>
        </div>
    </div>

    <div id="score-display" class="hidden">距離: <span id="distance">0</span>m</div>
    <div id="stage-display" class="hidden"><span id="stage-name">始まりの村</span></div>

    <div id="gate-action" class="hidden" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center;">
        <button id="btn-enter-gate" class="menu-btn">冒険に出発！</button>
        <p style="color: white; font-weight: bold; text-shadow: 2px 2px 2px black; font-size: 3vw; margin-top: 10px;">▲ボタン（キー）でも出発</p>
    </div>

    <div id="game-pad" class="hidden">
        <div class="pad-group">
            <div id="btn-left" class="action-btn">◀</div>
            <div id="btn-right" class="action-btn">▶</div>
        </div>
        <div class="pad-group">
            <div id="btn-jump" class="action-btn">▲</div>
        </div>
    </div>

    <!-- ★リニューアルされたタイトル画面 -->
    <div id="title-screen" class="screen">
        <!-- 中身は空にして、CSSで画像を背景にしています -->
    </div>

    <!-- ★追加：カスタム名前入力画面 -->
    <div id="name-input-modal" class="screen hidden" style="z-index: 60;">
        <h2 style="color: white; margin-bottom: 20px; text-shadow: 2px 2px 2px black;">名前を入力してください</h2>
        <input type="text" id="name-input-field" maxlength="10">
        <button id="btn-name-decide" class="menu-btn">決定</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff4d4d;">GAME OVER</h1>
        <p style="font-size: 5vw; margin-bottom: 20px;">記録: <span id="final-distance">0</span>m</p>
        <button id="btn-restart" class="menu-btn">タイトルへ戻る</button>
    </div>

    <div id="portrait-warning" class="screen">
        <h2>スマホを横向きにしてください</h2>
    </div>

    <!-- ★追加：フェード演出用レイヤー -->
    <div id="fade-overlay" class="hidden" style="position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index:999; pointer-events:none; opacity:0; transition: opacity 2s ease-in-out;"></div>
</div>

<script>
    // ==========================================
    // Firebase 設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCTU0ZEsxrTcTSDEJISNvOZFA6fJFNaFXg",
      authDomain: "action-game-62bac.firebaseapp.com",
      databaseURL: "https://action-game-62bac-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "action-game-62bac",
      storageBucket: "action-game-62bac.firebasestorage.app",
      messagingSenderId: "256673568778",
      appId: "1:256673568778:web:d9c05b62cd941215f5a7f3",
      measurementId: "G-SW5TYGT4P8"
    };

    let db = null;
    let myPlayerRef = null;
    const myPlayerId = 'user_' + Math.random().toString(36).substr(2, 9);
    let otherPlayers = {};

    try {
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            setupFirebaseListeners();
        }
    } catch (err) {
        console.error("Firebase初期化エラー:", err);
    }

    function setupFirebaseListeners() {
        if (!db) return;
        const playersRef = db.ref('village_players');

        playersRef.on('child_added', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                otherPlayers[snapshot.key] = {
                    ...data, drawX: data.x, drawYOffset: data.yOffset || 0, targetX: data.x, targetYOffset: data.yOffset || 0
                };
            }
        });

        playersRef.on('child_changed', (snapshot) => {
            if (snapshot.key !== myPlayerId) {
                const data = snapshot.val();
                if (otherPlayers[snapshot.key]) {
                    otherPlayers[snapshot.key].targetX = data.x;
                    otherPlayers[snapshot.key].targetYOffset = data.yOffset || 0;
                    otherPlayers[snapshot.key].facingRight = data.facingRight;
                    otherPlayers[snapshot.key].isGrounded = data.isGrounded;
                    otherPlayers[snapshot.key].updatedAt = data.updatedAt;
                } else {
                    otherPlayers[snapshot.key] = {
                        ...data, drawX: data.x, drawYOffset: data.yOffset || 0, targetX: data.x, targetYOffset: data.yOffset || 0
                    };
                }
            }
        });

        playersRef.on('child_removed', (snapshot) => {
            delete otherPlayers[snapshot.key];
        });
    }

    let lastSyncTime = 0;
    const SYNC_INTERVAL = 100;

    function syncMyPosition() {
        if (!db || gameState !== 'VILLAGE') return;
        const now = Date.now();
        if (now - lastSyncTime < SYNC_INTERVAL) return;
        lastSyncTime = now;

        if (!myPlayerRef) {
            myPlayerRef = db.ref('village_players/' + myPlayerId);
            myPlayerRef.onDisconnect().remove(); 
        }

        const villageGroundY = canvas.height - 110;
        const yOffset = villageGroundY - player.y;

        myPlayerRef.set({
            x: player.x,
            yOffset: yOffset,
            facingRight: playerFacingRight,
            isGrounded: player.isGrounded,
            updatedAt: now
        });
    }

    function removeMyPosition() {
        if (myPlayerRef) {
            myPlayerRef.remove();
            myPlayerRef = null;
        }
    }

    // ==========================================
    // DOM要素と基本設定
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const gamePad = document.getElementById('game-pad');
    const distanceEl = document.getElementById('distance');
    const finalDistanceEl = document.getElementById('final-distance');
    const stageDisplay = document.getElementById('stage-display');
    const stageNameEl = document.getElementById('stage-name');
    const gateActionUI = document.getElementById('gate-action');
    const fadeOverlay = document.getElementById('fade-overlay'); // ★追加
    
    document.getElementById('btn-enter-gate').addEventListener('click', enterGate);
    document.getElementById('btn-restart').addEventListener('click', showTitle);

    // ★追加：タイトル画面タップ時のフェード処理
    titleScreen.addEventListener('click', () => {
        // フェード用レイヤーを表示して暗くする
        fadeOverlay.classList.remove('hidden');
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                fadeOverlay.style.opacity = '1';
            });
        });

        // 2秒後（真っ暗になったタイミング）で裏側の画面を切り替える
        setTimeout(() => {
            startGame();
            
            // 画面がロビーに切り替わったら、今度はゆっくり明るくする
            fadeOverlay.style.opacity = '0';
            
            // 明るくなりきったらレイヤーを隠す
            setTimeout(() => {
                fadeOverlay.classList.add('hidden');
            }, 2000);
        }, 2000);
    });

    const keys = { left: false, right: false };
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') doJump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        const startAction = (e) => { e.preventDefault(); if(action === 'jump') doJump(); else keys[action] = true; };
        const endAction = (e) => { e.preventDefault(); if(action !== 'jump') keys[action] = false; };
        
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('touchstart', startAction);
        btn.addEventListener('mouseup', endAction);
        btn.addEventListener('touchend', endAction);
        btn.addEventListener('mouseleave', endAction);
    };
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');
    setupButton('btn-jump', 'jump');

    // ★追加：RPGステータス用変数
    let playerName = "プレイヤー";
    let playerLevel = 1;
    let playerExp = 0;
    let currentLevelReq = 2000;
    let nextLevelTotalExp = 2000;
    let maxStamina = 100;
    let currentStamina = 100;

    // ★追加：UI更新処理
    function updateStatusUI() {
        document.getElementById('status-name').innerText = playerName;
        document.getElementById('status-level').innerText = "Lv." + playerLevel;
        
        const staminaPercent = (currentStamina / maxStamina) * 100;
        document.getElementById('stamina-fill').style.width = Math.max(0, staminaPercent) + '%';
        
        // 魔力は未実装のためとりあえず常に100%
        document.getElementById('magic-fill').style.width = '100%';
    }

    // ★変更：カスタム名前入力画面の表示・決定処理
    const nameInputModal = document.getElementById('name-input-modal');
    const nameInputField = document.getElementById('name-input-field');
    const btnNameDecide = document.getElementById('btn-name-decide');

    function changePlayerName() {
        nameInputField.value = playerName;
        nameInputModal.classList.remove('hidden');
        nameInputField.focus();
    }

    btnNameDecide.addEventListener('click', () => {
        const newName = nameInputField.value;
        if (newName && newName.trim() !== "") {
            playerName = newName.trim();
            updateStatusUI();
        }
        nameInputModal.classList.add('hidden');
        
        // フルスクリーンを再要求してURLバーを消す
        const container = document.getElementById('game-container');
        requestFullscreenAndLock(container);
    });

    // ★追加：レベルアップ判定
    function checkLevelUp() {
        let leveledUp = false;
        while (playerExp >= nextLevelTotalExp) {
            playerLevel++;
            maxStamina += 2; // レベルが上がると最大スタミナ+2
            currentStamina = maxStamina; // レベルアップ時のおまけでスタミナ全回復
            
            currentLevelReq += 100; // 次の必要経験値が100上がる
            nextLevelTotalExp += currentLevelReq;
            leveledUp = true;
        }
        if (leveledUp) {
            updateStatusUI();
        }
    }

    // ★追加：1秒に1スタミナ回復するタイマー
    setInterval(() => {
        if (gameState === 'PLAYING' || gameState === 'VILLAGE') {
            if (currentStamina < maxStamina) {
                currentStamina = Math.min(maxStamina, currentStamina + 1);
                updateStatusUI();
            }
        }
    }, 1000);

    // ★変更：ジャンプ処理（スタミナ消費と連続ジャンプ対応）
    function doJump() {
        if (gameState === 'VILLAGE' && isNearGate) {
            enterGate();
            return;
        }

        if (gameState !== 'PLAYING' && gameState !== 'VILLAGE') return;
        
        if (player.isGrounded) {
            // 地上からのジャンプ（スタミナ消費0）
            player.vy = player.jumpPower;
            player.isGrounded = false;
            playJumpSound();
        } else {
            // 空中での連続ジャンプ（2段以上：スタミナ20消費）
            if (currentStamina >= 20) {
                currentStamina -= 20;
                player.vy = player.jumpPower;
                updateStatusUI();
                playJumpSound();
            }
        }
    }

    function playJumpSound() {
        jumpSound.currentTime = 0;
        jumpSound.play().catch(err => {
            console.warn("ジャンプ音の再生に失敗しました:", err);
        });
    }

    function resize() {
        const baseWidth = 1280; 
        const aspectRatio = window.innerHeight / window.innerWidth;
        canvas.width = baseWidth;
        canvas.height = baseWidth * aspectRatio;
    }
    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', () => { setTimeout(resize, 100); });
    document.addEventListener('webkitfullscreenchange', () => { setTimeout(resize, 100); });
    resize();

    // ==========================================
    // リソースとゲーム内変数設定
    // ==========================================
    const villageBg1 = new Image(); villageBg1.src = '村1.png';
    const villageBg2 = new Image(); villageBg2.src = '村2.png';
    const VILLAGE_WIDTH = 2560; 
    const GATE_WIDTH = 140;
    const GATE_HEIGHT = 180;
    const GATE_X = 1280 - (GATE_WIDTH / 2); 
    let cameraX = 0;
    let isNearGate = false;

    const STAGE2_DISTANCE = 1000; 
    const STAGE3_DISTANCE = 2000; 
    const STAGE4_DISTANCE = 3000; 
    const STAGE5_DISTANCE = 4000; 
    const STAGE6_DISTANCE = 5000;
    const STAGE7_DISTANCE = 6000;

    const bgImage1 = new Image(); bgImage1.src = 'ChatGPT Image 2026年7月15日 00_45_17.png';
    const bgImage2 = new Image(); bgImage2.src = 'stage2.png';
    const bgImage3 = new Image(); bgImage3.src = 'stage3.png';
    const bgImage4 = new Image(); bgImage4.src = 'stage4.png';
    const bgImage5 = new Image(); bgImage5.src = 'stage5.png';
    const platformImg = new Image(); platformImg.src = 'platform.png';
    const boxImg = new Image(); boxImg.src = '木箱.png';
    let boxes = [];

    let currentBgImage = bgImage1;
    let bgOffset = 0;

    const playerImgWalk = new Image(); playerImgWalk.src = 'si1.png';
    const playerImgJump = new Image(); playerImgJump.src = 'si2.png';
    let playerFacingRight = true;

    const enemyImg = new Image(); enemyImg.src = 'ku.png';
    const hopperGroundImg = new Image(); hopperGroundImg.src = 'バッタ地上.png';
    const hopperJumpImg = new Image(); hopperJumpImg.src = 'バッタジャンプ.png';
    const cactusImg = new Image(); cactusImg.src = 'サボテン.png';

    const bgm = new Audio('伝承の丘.mp3'); 
    bgm.loop = true; bgm.volume = 0.5;

    const jumpSound = new Audio('jump.mp3'); 
    jumpSound.volume = 0.4;

    let gameState = 'TITLE';
    let animationId;
    let distance = 0;
    let lastTime = 0;
    const FPS = 60;
    const frameInterval = 1000 / FPS;
    
    const player = {
        x: 50, y: 200, width: 60, height: 50,
        vx: 0, vy: 0, speed: 6, gravity: 0.8, jumpPower: -13,
        isGrounded: false
    };

    let platforms = [];
    let enemies = [];
    let icicles = [];
    let cacti = [];
    let isWindy = false;
    let windWarning = false;
    let windTimer = 0;

    function initVillage() {
        player.x = GATE_X + (GATE_WIDTH / 2) - (player.width / 2);
        player.y = canvas.height - 180;
        player.vx = 0;
        player.vy = 0;
        keys.left = false;
        keys.right = false;
        playerFacingRight = true;
        isNearGate = false;
        gateActionUI.classList.add('hidden');
    }

    function initMap() {
        platforms = [];
        enemies = [];
        icicles = [];
        boxes = [];
        cacti = [];
        distance = 0; 
        bgOffset = 0;
        currentBgImage = bgImage1;
        player.x = 50; player.y = 100;
        player.vx = 0; player.vy = 0;
        keys.left = false; keys.right = false;
        playerFacingRight = true; 
        isWindy = false;
        windWarning = false;
        windTimer = 0;
        platforms.push({ x: 0, y: canvas.height - 100, width: canvas.width, height: 100 });
    }

    function requestFullscreenAndLock(element) {
        const requestFS = element.requestFullscreen || element.webkitRequestFullscreen || element.mozRequestFullScreen || element.msRequestFullscreen;
        if (requestFS) {
            requestFS.call(element).then(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            }).catch(() => {});
        }
    }

    function startGame() {
        const container = document.getElementById('game-container');
        requestFullscreenAndLock(container);

        bgm.currentTime = 0;
        bgm.play().catch(() => {});

        titleScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreDisplay.classList.add('hidden');
        gateActionUI.classList.add('hidden');
        gamePad.classList.remove('hidden');
        stageDisplay.classList.remove('hidden');
        stageNameEl.innerText = "始まりの村";

        document.getElementById('status-ui').classList.remove('hidden');
        updateStatusUI();

        gameState = 'VILLAGE';
        initVillage();
        
        lastTime = performance.now();
        animationId = requestAnimationFrame(loop);
    }

    function enterGate() {
        if (gameState !== 'VILLAGE') return;
        removeMyPosition();
        gateActionUI.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        stageNameEl.innerText = "アスター平原";
        gameState = 'PLAYING';
        initMap();
    }

    function showTitle() {
        removeMyPosition();
        gameOverScreen.classList.add('hidden');
        document.getElementById('status-ui').classList.add('hidden');
        titleScreen.classList.remove('hidden');
        gameState = 'TITLE';
    }

    function gameOver() {
        removeMyPosition();
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        bgm.pause();

        scoreDisplay.classList.add('hidden');
        gamePad.classList.add('hidden');
        stageDisplay.classList.add('hidden');
        gateActionUI.classList.add('hidden');
        document.getElementById('status-ui').classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalDistanceEl.innerText = Math.floor(distance);
    }

    function updateVillage() {
        if (keys.left) {
            player.vx = -player.speed; playerFacingRight = false;
        } else if (keys.right) {
            player.vx = player.speed; playerFacingRight = true;
        } else {
            player.vx = 0;
        }

        player.x += player.vx;

        if (player.x < 0) player.x = 0;
        if (player.x > VILLAGE_WIDTH - player.width) player.x = VILLAGE_WIDTH - player.width;

        const villageGroundY = canvas.height - 110;
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.y + player.height > villageGroundY) {
            player.y = villageGroundY - player.height;
            player.vy = 0;
            player.isGrounded = true;
        } else {
            player.isGrounded = false;
        }

        cameraX = player.x + player.width / 2 - canvas.width / 2;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > VILLAGE_WIDTH - canvas.width) cameraX = VILLAGE_WIDTH - canvas.width;

        const playerCenterX = player.x + player.width / 2;
        const gateMargin = 80;
        
        if (playerCenterX >= GATE_X - gateMargin && playerCenterX <= GATE_X + GATE_WIDTH + gateMargin) {
            if (!isNearGate) {
                isNearGate = true;
                gateActionUI.classList.remove('hidden');
            }
        } else {
            if (isNearGate) {
                isNearGate = false;
                gateActionUI.classList.add('hidden');
            }
        }
        syncMyPosition();
    }

    function drawVillage() {
        const now = Date.now();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (villageBg1.complete && villageBg1.width > 0) {
            ctx.drawImage(villageBg1, 0 - cameraX, 0, 1280, canvas.height);
        }
        if (villageBg2.complete && villageBg2.width > 0) {
            ctx.drawImage(villageBg2, 1280 - cameraX, 0, 1280, canvas.height);
        }

        const gateScreenX = GATE_X - cameraX;
        const gateY = canvas.height - 110 - GATE_HEIGHT;

        ctx.fillStyle = '#4A2E18';
        ctx.fillRect(gateScreenX, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(gateScreenX + GATE_WIDTH - 20, gateY, 20, GATE_HEIGHT);
        ctx.fillRect(gateScreenX, gateY, GATE_WIDTH, 30);

        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('冒険の門', gateScreenX + GATE_WIDTH / 2, gateY + 22);

        if (isNearGate) {
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(gateScreenX + GATE_WIDTH / 2, gateY + GATE_HEIGHT, 80, 0, Math.PI, true);
            ctx.fill();
        }

        const villageGroundY = canvas.height - 110;

        for (let key in otherPlayers) {
            const op = otherPlayers[key];
            if (now - op.updatedAt > 5000) continue;

            if (op.targetX !== undefined) {
                op.drawX += (op.targetX - op.drawX) * 0.2; 
            }
            if (op.targetYOffset !== undefined) {
                op.drawYOffset += (op.targetYOffset - op.drawYOffset) * 0.2;
            }

            const opDrawX = op.drawX - cameraX;
            const opDrawY = villageGroundY - (op.drawYOffset || 0);

            if (opDrawX + player.width > -100 && opDrawX < canvas.width + 100) {
                let opImg = op.isGrounded ? playerImgWalk : playerImgJump;

                ctx.save();
                if (opImg.complete && opImg.width > 0) {
                    if (op.facingRight) {
                        ctx.drawImage(opImg, opDrawX, opDrawY, player.width, player.height);
                    } else {
                        ctx.translate(opDrawX + player.width / 2, opDrawY + player.height / 2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(opImg, -player.width / 2, -player.height / 2, player.width, player.height);
                    }
                } else {
                    ctx.fillStyle = 'orange';
                    ctx.fillRect(opDrawX, opDrawY, player.width, player.height);
                }
                ctx.restore();

                ctx.fillStyle = '#00FFCC';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("PLAYER", opDrawX + player.width / 2, opDrawY - 8);
            }
        }

        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        const drawX = player.x - cameraX;

        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, drawX, player.y, player.width, player.height);
            } else {
                ctx.translate(drawX + player.width / 2, player.y + player.height / 2);
                ctx.scale(-1, 1);
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = 'blue';
            ctx.fillRect(drawX, player.y, player.width, player.height);
        }

        ctx.fillStyle = '#FFFF00';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("YOU", drawX + player.width / 2, player.y - 8);
    }

    function generateMap() {
        const lastPlatform = platforms[platforms.length - 1];
        if (lastPlatform.x + lastPlatform.width < canvas.width + 500) {
            const isStage6 = (distance >= STAGE6_DISTANCE && distance < STAGE7_DISTANCE);
            const gap = isStage6 ? -2 : Math.random() * 100 + 50; 
            const yOffset = isStage6 ? 0 : (Math.random() - 0.5) * 150;
            
            let newY = lastPlatform.y + yOffset;
            const width = Math.random() * 300 + 150;
            
            if (newY > canvas.height - 50) newY = canvas.height - 50;
            if (newY < canvas.height - 250) newY = canvas.height - 250;

            const newX = lastPlatform.x + lastPlatform.width + gap;
            platforms.push({ x: newX, y: newY, width: width, height: canvas.height - newY });

            if (Math.random() < 0.5) {
                let enemyType = 'normal';
                if (distance >= STAGE4_DISTANCE && distance < STAGE5_DISTANCE) {
                    enemyType = Math.random() < 0.5 ? 'normal' : 'hopper';
                } else if (distance >= STAGE2_DISTANCE) {
                    enemyType = 'hopper';
                }
                const eWidth = 60;
                const eHeight = (enemyType === 'hopper') ? 50 : 40;
                const enemyOffset = 37; 
                enemies.push({
                    type: enemyType, x: newX + width / 2, y: newY - eHeight + enemyOffset,
                    width: eWidth, height: eHeight, spawnY: newY + enemyOffset,
                    vy: 0, isGrounded: true, jumpTimer: (enemyType === 'hopper') ? Math.floor(Math.random() * 40) + 30 : 0,
                    isSquished: false, squishTimer: 0
                });
            } else if (isStage6 && Math.random() < 0.7) {
                const cactusSize = 70;
                const embedAmount = 37; 
                cacti.push({
                    x: newX + width / 2, y: newY - cactusSize + embedAmount, width: cactusSize, height: cactusSize
                });
            }
            
            const isStage3 = (distance >= STAGE3_DISTANCE && distance < STAGE4_DISTANCE);
            if (isStage3 && Math.random() < 0.4) {
                icicles.push({
                    x: newX + Math.random() * (width - 40) + 20, y: 0, width: 30, height: 80, vy: 0, isFalling: false
                });
            }
            
            if (Math.random() < 0.3) {
                const boxSize = 60;
                const embedAmount = 45;
                boxes.push({
                    x: newX + width / 2 + 80, y: newY - boxSize + embedAmount, width: boxSize, height: boxSize
                });
            }
        }
    }
    
    function update() {
        if (gameState === 'VILLAGE') {
            updateVillage();
            return;
        }
        if (gameState !== 'PLAYING') return;

        if (distance >= STAGE5_DISTANCE) {
            currentBgImage = bgImage5; stageNameEl.innerText = "グリオン砂漠";
        } else if (distance >= STAGE4_DISTANCE) {
            currentBgImage = bgImage4; stageNameEl.innerText = "レニリアの森";
        } else if (distance >= STAGE3_DISTANCE) {
            currentBgImage = bgImage3; stageNameEl.innerText = "オロ雪原";
        } else if (distance >= STAGE2_DISTANCE) {
            currentBgImage = bgImage2; stageNameEl.innerText = "ヴィリカ海岸";
        } else {
            currentBgImage = bgImage1; stageNameEl.innerText = "アスター平原";
        }

        if (keys.left) {
            player.vx = -player.speed; playerFacingRight = false; 
        } else if (keys.right) {
            player.vx = player.speed; playerFacingRight = true;  
        } else {
            player.vx = 0;
        }

        player.x += player.vx;
        if (player.x < 0) player.x = 0;

        if (distance >= STAGE5_DISTANCE) {
            if (!isWindy && !windWarning) {
                if (Math.random() < 0.005) { windWarning = true; windTimer = 60; }
            } else if (windWarning) {
                windTimer--;
                if (windTimer <= 0) { windWarning = false; isWindy = true; windTimer = 150; }
            } else if (isWindy) {
                windTimer--;
                player.x -= 4.0;
                if (player.x < 0) player.x = 0;
                if (windTimer <= 0) { isWindy = false; }
            }
        }

        player.vy += player.gravity;
        player.y += player.vy;
        player.isGrounded = false;

        enemies.forEach(e => {
            if (e.isSquished) { e.squishTimer--; return; }
            if (e.type === 'hopper') {
                if (e.isGrounded) {
                    e.jumpTimer--;
                    if (e.jumpTimer <= 0) { e.vy = -11; e.isGrounded = false; }
                } else {
                    e.vy += 0.5; e.y += e.vy;
                    if (e.y >= e.spawnY - e.height) { e.y = e.spawnY - e.height; e.vy = 0; e.isGrounded = true; e.jumpTimer = 80; }
                }
            }
        });

        icicles.forEach(icicle => {
            if (!icicle.isFalling && Math.abs(player.x + player.width / 2 - (icicle.x + icicle.width / 2)) < 150) {
                icicle.isFalling = true;
            }
            if (icicle.isFalling) { icicle.vy += player.gravity * 0.7; icicle.y += icicle.vy; }

            const hitboxMargin = 10;
            if (player.x + hitboxMargin < icicle.x + icicle.width && player.x + player.width - hitboxMargin > icicle.x &&
                player.y + hitboxMargin < icicle.y + icicle.height && player.y + player.height - hitboxMargin > icicle.y) {
                gameOver();
            }
        });

        enemies.forEach(e => {
            if (e.isSquished) return;
            const hitboxMargin = 10; 
            if (player.x + hitboxMargin < e.x + e.width && player.x + player.width - hitboxMargin > e.x &&
                player.y + hitboxMargin < e.y + e.height && player.y + player.height - hitboxMargin > e.y) {
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.isSquished = true; e.squishTimer = 20; 
                    player.vy = player.jumpPower * 0.8; player.isGrounded = false;
                } else {
                    gameOver();
                }
            }
        });

        platforms.forEach(p => {
            const footOffset = 37; 
            const marginX = 15;
            if (player.x + marginX < p.x + p.width && player.x + player.width - marginX > p.x &&
                player.y < p.y + p.height && player.y + player.height - footOffset > p.y) {
                if (player.vy > 0) {
                    player.isGrounded = true; player.vy = 0; player.y = p.y - player.height + footOffset;
                } else if (player.vy < 0) {
                    player.vy = 0; player.y = p.y + p.height;
                }
            }
        });

        const scrollThreshold = canvas.width / 2;
        if (player.x > scrollThreshold) {
            const offset = player.x - scrollThreshold;
            player.x = scrollThreshold;
            
            let addedDist = offset * 0.05;
            distance += addedDist;
            playerExp += addedDist;
            distanceEl.innerText = Math.floor(distance);
            
            checkLevelUp();

            platforms.forEach(p => p.x -= offset);
            enemies.forEach(e => e.x -= offset);
            icicles.forEach(i => i.x -= offset);
            boxes.forEach(b => b.x -= offset);
            cacti.forEach(c => c.x -= offset);

            bgOffset += offset * 0.5;
        }

        if (platforms[0].x + platforms[0].width < -100) platforms.shift();
        
        enemies = enemies.filter(e => (e.x + e.width >= -100) && (!e.isSquished || e.squishTimer > 0));
        icicles = icicles.filter(i => (i.x + i.width >= -100) && i.y < canvas.height);
        boxes = boxes.filter(b => b.x + b.width >= -100);
        cacti = cacti.filter(c => c.x + c.width >= -100);

        cacti.forEach(c => {
            const hitboxMargin = 15;
            if (player.x + hitboxMargin < c.x + c.width && player.x + player.width - hitboxMargin > c.x &&
                player.y + hitboxMargin < c.y + c.height && player.y + player.height - hitboxMargin > c.y) {
                gameOver();
            }
        });

        boxes.forEach(b => {
            const marginX = 15; const footOffset = 37; const standOffset = 20;
            const pLeft = player.x + marginX; const pRight = player.x + player.width - marginX;
            const pTop = player.y; const pBottom = player.y + player.height - footOffset + standOffset;

            if (pLeft < b.x + b.width && pRight > b.x && pTop < b.y + b.height && pBottom > b.y) {
                if (player.vy > 0 && pBottom - player.vy <= b.y + 25) {
                    player.isGrounded = true; player.vy = 0; player.y = b.y - player.height + footOffset - standOffset;
                } else {
                    if (player.vx > 0) { player.x = b.x - player.width + marginX; } 
                    else if (player.vx < 0) { player.x = b.x + b.width - marginX; }
                }
            }
        });
        
        generateMap();

        if (player.y > canvas.height) {
            gameOver();
        }
    }

    function draw() {
        if (gameState === 'VILLAGE') {
            drawVillage();
            return;
        }

        if (currentBgImage.complete && currentBgImage.width > 0) {
            const scale = canvas.height / currentBgImage.height;
            const scaledWidth = currentBgImage.width * scale;
            const xOffset = bgOffset % scaledWidth;
            
            ctx.drawImage(currentBgImage, -xOffset, 0, scaledWidth, canvas.height);
            ctx.drawImage(currentBgImage, -xOffset + scaledWidth, 0, scaledWidth, canvas.height);
            if (scaledWidth - xOffset < canvas.width) {
                ctx.drawImage(currentBgImage, -xOffset + scaledWidth * 2, 0, scaledWidth, canvas.height);
            }
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        platforms.forEach(p => {
            const imgHeight = 100; 
            if (platformImg.complete && platformImg.width > 0) {
                ctx.drawImage(platformImg, p.x, p.y, p.width, imgHeight);
                if (p.height > imgHeight) {
                    ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y + imgHeight, p.width, p.height - imgHeight);
                }
            } else {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#228B22'; ctx.fillRect(p.x, p.y, p.width, 15);
            }
        });
        
        enemies.forEach(e => {
            if (e.type === 'hopper') {
                let currentEnemyImg = e.isGrounded ? hopperGroundImg : hopperJumpImg;
                if (currentEnemyImg.complete && currentEnemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.drawImage(currentEnemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(currentEnemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    ctx.fillStyle = 'green';
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillRect(e.x, e.y, e.width, e.height);
                    }
                }
            } else {
                if (enemyImg.complete && enemyImg.width > 0) {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.drawImage(enemyImg, e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height);
                    }
                } else {
                    if (e.isSquished) {
                        const squishedHeight = e.height * 0.25; ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y + e.height - squishedHeight, e.width, squishedHeight);
                    } else {
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x, e.y, e.width, e.height);
                        ctx.fillStyle = 'white'; ctx.fillRect(e.x + 5, e.y + 5, 5, 5); ctx.fillRect(e.x + 20, e.y + 5, 5, 5);
                    }
                }
            }
        });

        icicles.forEach(icicle => {
            ctx.fillStyle = '#E0FFFF';
            ctx.beginPath();
            ctx.moveTo(icicle.x, icicle.y); ctx.lineTo(icicle.x + icicle.width, icicle.y); ctx.lineTo(icicle.x + icicle.width / 2, icicle.y + icicle.height);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#B0E0E6'; ctx.lineWidth = 2; ctx.stroke();
        });

        boxes.forEach(b => {
            if (boxImg.complete && boxImg.width > 0) { ctx.drawImage(boxImg, b.x, b.y, b.width, b.height); } 
            else { ctx.fillStyle = '#8B4513'; ctx.fillRect(b.x, b.y, b.width, b.height); }
        });

        cacti.forEach(c => {
            if (cactusImg.complete && cactusImg.width > 0) { ctx.drawImage(cactusImg, c.x, c.y, c.width, c.height); } 
            else { ctx.fillStyle = 'green'; ctx.fillRect(c.x, c.y, c.width, c.height); }
        });
        
        let currentImg = player.isGrounded ? playerImgWalk : playerImgJump;
        if (currentImg.complete && currentImg.width > 0) {
            ctx.save();
            if (playerFacingRight) {
                ctx.drawImage(currentImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2); 
                ctx.scale(-1, 1); 
                ctx.drawImage(currentImg, -player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
        } else {
            ctx.fillStyle = 'blue'; ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        if (windWarning) {
            ctx.fillStyle = "rgba(255, 69, 0, 0.8)"; ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("⚠️ 突風注意！", canvas.width / 2, canvas.height / 3);
        } else if (isWindy) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)"; ctx.font = "bold 40px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("༄༅༄༅ 突風発生中！ ༄༅༄༅", canvas.width / 2, canvas.height / 3);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 3;
            for (let i = 0; i < 6; i++) {
                let windX = Math.random() * canvas.width; let windY = Math.random() * canvas.height;
                ctx.beginPath(); ctx.moveTo(windX, windY); ctx.lineTo(windX - (100 + Math.random() * 150), windY); ctx.stroke();
            }
        }
    } 

    function loop(timestamp) {
        if (gameState === 'PLAYING' || gameState === 'VILLAGE') {
            animationId = requestAnimationFrame(loop);
            if (!timestamp) timestamp = performance.now();
            if (!lastTime) lastTime = timestamp;

            const elapsed = timestamp - lastTime;
            if (elapsed >= frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);
                update();
                draw();
            }
        }
    }
</script>
